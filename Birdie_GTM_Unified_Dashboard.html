ccounts matched this filter.</div>';\n  } else {\n    let html = '<div class=\"tbl-wrap\"><table><thead><tr>' +\n      '<th>Tier</th><th>ICP</th><th>Account</th><th>Segment</th><th>Country</th>' +\n      '<th>Employees</th><th>Revenue</th><th>Customers</th><th>ABM Reference</th><th>Target Role</th><th>Next Step</th>' +\n      '</tr></thead><tbody>';\n    const sorted = [...rows].sort((a,b) => tierPriority(a.tier) - tierPriority(b.tier) || b.icp - a.icp);\n    sorted.forEach(a => { html += buildRow(a); });\n    html += '</tbody></table></div>';\n    body.innerHTML = html;\n  }\n  document.getElementById('drill').classList.add('open');\n}\n\nfunction drillByName(key){\n  const map = {\n    'all': ['All Accounts', ACCOUNTS],\n    'tier1': ['Tier 1 — Priority', ACCOUNTS.filter(a => a.tier==='Tier 1')],\n    'tier2': ['Tier 2 — High', ACCOUNTS.filter(a => a.tier==='Tier 2')],\n    'tier3': ['Tier 3 — Nurture', ACCOUNTS.filter(a => a.tier==='Tier 3')],\n    'highvolume': ['High B2C Volume (1M+ customers)', ACCOUNTS.filter(a => a.cc_bucket==='10M+ customers' || a.cc_bucket==='1M-10M')],\n    'sweetspot': ['Sweet Spot (500-5k fte)', ACCOUNTS.filter(a => a.d2_label && a.d2_label.includes('Sweet'))],\n    'usa': ['🇺🇸 USA accounts', ACCOUNTS.filter(a => (a.country||'').includes('USA'))],\n  };\n  const [title, rows] = map[key];\n  openDrill(title, rows);\n}\n\nfunction openAccountDetail(name){\n  const a = ACCOUNTS.find(x => x.lookalike === name);\n  if(!a) return;\n  const tierColor = TIER_COLORS[a.tier] || '#6b8b8a';\n  const refsChips = (a.reference_list||[]).map(r => '<span class=\"chip ref\" style=\"padding:5px 10px;font-size:11px\">'+r+'</span>').join(' ');\n\n  const detail = '<div style=\"padding:20px 24px\">' +\n    '<div style=\"display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap;margin-bottom:16px\">' +\n      '<div><h3 style=\"font-size:20px;color:#0d4f4e;font-weight:800\">'+a.lookalike+'</h3>' +\n      '<div style=\"color:#6b8b8a;font-size:13px;margin-top:4px\">'+(a.segment||'')+' · '+(a.country||'')+' · '+(a.locality||'')+'</div>' +\n      '<div style=\"margin-top:4px\"><a href=\"https://'+a.website+'\" target=\"_blank\" rel=\"noopener\" style=\"color:#1b7a78;font-weight:700\">'+a.website+' →</a></div>' +\n      (a.description ? '<div style=\"margin-top:8px;color:#1b7a78;font-size:12px;font-style:italic\">'+a.description+'</div>' : '') +\n      '</div>' +\n      '<div><span class=\"chip tier\" style=\"background:'+tierColor+';padding:6px 14px;font-size:12px\">'+a.tier+' · ICP '+a.icp+'</span></div>' +\n    '</div>' +\n\n    '<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px\">' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">D1 Market</div><div style=\"font-size:20px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+a.d1+'/30</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">'+a.d1_label+'</div></div>' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">D2 Size</div><div style=\"font-size:20px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+a.d2+'/25</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">'+a.d2_label+'</div></div>' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">D3 Stage</div><div style=\"font-size:20px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+a.d3+'/25</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">'+a.d3_label+'</div></div>' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">D4 Intent</div><div style=\"font-size:20px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+a.d4+'/20</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">'+a.d4_label+'</div></div>' +\n    '</div>' +\n\n    '<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px\">' +\n      '<div style=\"background:#e7f7f3;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#0d4f4e;text-transform:uppercase;font-weight:700\">Employees</div><div style=\"font-size:18px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+(a.employee_count ? Number(a.employee_count).toLocaleString() : '—')+'</div></div>' +\n      '<div style=\"background:#e7f7f3;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#0d4f4e;text-transform:uppercase;font-weight:700\">Annual Revenue</div><div style=\"font-size:18px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+(a.annual_revenue||'—')+'</div></div>' +\n      '<div style=\"background:#e7f7f3;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#0d4f4e;text-transform:uppercase;font-weight:700\">Customer Base</div><div style=\"font-size:18px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+fmtCC(a.customer_count)+'</div></div>' +\n    '</div>' +\n\n    '<div style=\"margin-top:14px;padding:12px;background:#f4f8f8;border-radius:6px\">' +\n      '<div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">ABM Reference (Birdie target accounts)</div>' +\n      '<div style=\"margin-top:6px\">'+refsChips+'</div>' +\n    '</div>' +\n\n    '<div style=\"margin-top:14px;padding:12px;background:#e7f7f3;border-left:3px solid #0d4f4e;border-radius:4px\">' +\n      '<div style=\"font-size:10px;color:#0d4f4e;text-transform:uppercase;font-weight:700\">Target Role</div>' +\n      '<div style=\"font-size:14px;margin-top:4px;color:#0d4f4e;font-weight:700\">'+a.target_sub+'</div>' +\n      '<div style=\"font-size:12px;color:#1b7a78;margin-top:4px\">'+a.target_titles+'</div>' +\n    '</div>' +\n\n    '<div style=\"margin-top:14px;padding:12px;background:#0d4f4e;border-radius:6px;color:#fff\">' +\n      '<div style=\"font-size:10px;color:#5ac8b8;text-transform:uppercase;font-weight:700\">Recommended Next Step</div>' +\n      '<div style=\"font-size:14px;margin-top:4px;font-weight:700\">'+a.next_step+'</div>' +\n    '</div>' +\n  '</div>';\n\n  document.getElementById('drill-title').textContent = a.lookalike + ' — Account Detail';\n  document.getElementById('drill-body').innerHTML = detail;\n  drillData = [a];\n  document.getElementById('drill').classList.add('open');\n}\n\nfunction closeDrill(){document.getElementById('drill').classList.remove('open');}\n\nfunction exportDrill(){\n  if(drillData.length === 0) return;\n  const cols = ['Tier','ICP','Account','Segment','Country','Locality','Website','Company','Description',\n                'Industry','Employees','Annual Revenue','Customer Count','ABM Reference',\n                'D1','D1 Label','D2','D2 Label','D3','D3 Label','D4','D4 Label',\n                'Target Sub','Target Titles','Next Step'];\n  const rows = drillData.map(a => [\n    a.tier, a.icp, a.lookalike, a.segment, a.country, a.locality, a.website, a.company, a.description,\n    a.industry, a.employee_count, a.annual_revenue, a.customer_count, a.reference_abm,\n    a.d1, a.d1_label, a.d2, a.d2_label, a.d3, a.d3_label, a.d4, a.d4_label,\n    a.target_sub, a.target_titles, a.next_step\n  ]);\n  const csv = [cols, ...rows].map(r => r.map(v => {\n    v = v == null ? '' : String(v);\n    if(v.includes(',') || v.includes('\"') || v.includes('\\n')) return '\"'+v.replace(/\"/g,'\"\"')+'\"';\n    return v;\n  }).join(',')).join('\\n');\n  const blob = new Blob(['\\ufeff'+csv], {type:'text/csv;charset=utf-8'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'birdie_abm_lookalikes_' + Date.now() + '.csv';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\n// Sidebar clicks\ndocument.querySelectorAll('.sidebar .list-item, .sidebar .all-btn').forEach(el => {\n  el.addEventListener('click', () => {\n    document.querySelectorAll('.sidebar .list-item, .sidebar .all-btn').forEach(e => e.classList.remove('active'));\n    el.classList.add('active');\n    const filter = el.dataset.filter;\n    const val = el.dataset.val;\n    let title, rows;\n    if(filter === 'all'){title='All Accounts'; rows=ACCOUNTS;}\n    else if(filter === 'tier'){title=val; rows=ACCOUNTS.filter(a => a.tier === val);}\n    else if(filter === 'volume'){title=val+' customers'; rows=ACCOUNTS.filter(a => a.cc_bucket === val);}\n    else if(filter === 'country'){title=val; rows=ACCOUNTS.filter(a => (a.country||'').includes(val));}\n    renderMainTable(rows);\n    openDrill(title, rows);\n  });\n});\n\n// CHART: Tier bar\nfunction renderTierChart(){\n  const data = [\n    {label:'Tier 1', count:ACCOUNTS.filter(a=>a.tier==='Tier 1').length, color:'#0d4f4e', key:'tier1'},\n    {label:'Tier 2', count:ACCOUNTS.filter(a=>a.tier==='Tier 2').length, color:'#1b7a78', key:'tier2'},\n    {label:'Tier 3', count:ACCOUNTS.filter(a=>a.tier==='Tier 3').length, color:'#5ac8b8', key:'tier3'},\n  ];\n  const max = Math.max(...data.map(d=>d.count), 1);\n  const el = document.getElementById('chart-tier');\n  el.innerHTML = data.map(d => {\n    const w = (d.count/max*100).toFixed(1);\n    const pct = Math.round(d.count/ACCOUNTS.length*100);\n    return '<div class=\"bar-row\" onclick=\"drillByName(\\''+d.key+'\\')\">' +\n      '<div class=\"bar-label\">'+d.label+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:'+d.color+'\">'+d.count+'</div></div>' +\n      '<div class=\"bar-value\">'+pct+'%</div>' +\n    '</div>';\n  }).join('');\n}\n\n// CHART: Segment bar\nfunction renderSegmentChart(){\n  const counts = {};\n  ACCOUNTS.forEach(a => { if(a.segment){ counts[a.segment] = (counts[a.segment]||0)+1; }});\n  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 10);\n  const max = sorted[0] ? sorted[0][1] : 1;\n  const el = document.getElementById('chart-segment');\n  el.innerHTML = sorted.map(([seg, cnt]) => {\n    const w = (cnt/max*100).toFixed(1);\n    const segEsc = seg.replace(/'/g, \"\\\\'\");\n    return '<div class=\"bar-row\" onclick=\"openDrill(\\''+segEsc+' segment\\', ACCOUNTS.filter(a => a.segment===\\''+segEsc+'\\'))\">' +\n      '<div class=\"bar-label\" title=\"'+seg+'\">'+seg+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:#1b7a78\">'+cnt+'</div></div>' +\n      '<div class=\"bar-value\">'+cnt+'</div>' +\n    '</div>';\n  }).join('');\n}\n\n// CHART: Volume donut\nfunction renderVolumeDonut(){\n  const buckets = ['10M+ customers','1M-10M','100K-1M','10K-100K','<10K','Unknown'];\n  const data = buckets.map(b => ({label:b, count:ACCOUNTS.filter(a=>a.cc_bucket===b).length, color:VOL_COLORS[b]})).filter(d=>d.count>0);\n  const total = data.reduce((s,d)=>s+d.count, 0);\n  const svg = document.getElementById('donut-volume');\n  const cx=80, cy=80, r=60, ir=38;\n  let a0 = -Math.PI/2;\n  let paths = '';\n  data.forEach(d => {\n    if(d.count===0) return;\n    const a1 = a0 + (d.count/total)*2*Math.PI;\n    const large = (a1-a0) > Math.PI ? 1 : 0;\n    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);\n    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);\n    const xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);\n    const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1);\n    paths += '<path d=\"M '+x0+' '+y0+' A '+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' L '+xi1+' '+yi1+' A '+ir+' '+ir+' 0 '+large+' 0 '+xi0+' '+yi0+' Z\" fill=\"'+d.color+'\" style=\"cursor:pointer\" onclick=\"openDrill(\\''+d.label+'\\', ACCOUNTS.filter(a => a.cc_bucket===\\''+d.label+'\\'))\"><title>'+d.label+': '+d.count+'</title></path>';\n    a0 = a1;\n  });\n  svg.innerHTML = paths + '<text x=\"'+cx+'\" y=\"'+(cy-4)+'\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"#0d4f4e\">'+total+'</text><text x=\"'+cx+'\" y=\"'+(cy+16)+'\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6b8b8a\" letter-spacing=\"1\">TOTAL</text>';\n\n  const legend = document.getElementById('donut-volume-legend');\n  legend.innerHTML = data.map(d => {\n    const pct = (d.count/total*100).toFixed(0);\n    return '<div class=\"legend-row\" onclick=\"openDrill(\\''+d.label+'\\', ACCOUNTS.filter(a => a.cc_bucket===\\''+d.label+'\\'))\">' +\n      '<div class=\"legend-dot\" style=\"background:'+d.color+'\"></div>' +\n      '<div class=\"legend-label\">'+d.label+'</div>' +\n      '<div class=\"legend-value\">'+d.count+'</div><div class=\"legend-pct\">('+pct+'%)</div>' +\n    '</div>';\n  }).join('');\n}\n\n// CHART: References bar\nfunction renderReferencesChart(){\n  const counts = {};\n  ACCOUNTS.forEach(a => {\n    (a.reference_list||[]).forEach(r => { counts[r] = (counts[r]||0)+1; });\n  });\n  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 10);\n  const max = sorted[0] ? sorted[0][1] : 1;\n  const el = document.getElementById('chart-references');\n  el.innerHTML = sorted.map(([ref, cnt]) => {\n    const w = (cnt/max*100).toFixed(1);\n    const refEsc = ref.replace(/'/g, \"\\\\'\");\n    return '<div class=\"bar-row\" onclick=\"openDrill(\\'Lookalikes of '+refEsc+'\\', ACCOUNTS.filter(a => (a.reference_list||[]).includes(\\''+refEsc+'\\')))\">' +\n      '<div class=\"bar-label\">'+ref+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:#0d4f4e\">'+cnt+'</div></div>' +\n      '<div class=\"bar-value\">'+cnt+'</div>' +\n    '</div>';\n  }).join('');\n}\n\n// HEATMAP: Segment × Tier\nfunction renderHeatmap(){\n  const segs = {};\n  ACCOUNTS.forEach(a => { if(a.segment){ segs[a.segment] = (segs[a.segment]||0)+1; }});\n  const topSegs = Object.entries(segs).sort((a,b)=>b[1]-a[1]).slice(0, 10).map(x=>x[0]);\n  const tiers = ['Tier 1','Tier 2','Tier 3'];\n  const matrix = {};\n  topSegs.forEach(s => {\n    matrix[s] = {};\n    tiers.forEach(t => { matrix[s][t] = ACCOUNTS.filter(a => a.segment===s && a.tier===t).length; });\n  });\n  let maxVal = 0;\n  topSegs.forEach(s => tiers.forEach(t => { if(matrix[s][t] > maxVal) maxVal = matrix[s][t]; }));\n\n  let html = '<table class=\"heatmap\"><thead><tr><th class=\"row-hdr\">Segment</th>';\n  tiers.forEach(t => { html += '<th>'+t+'</th>'; });\n  html += '<th>Total</th></tr></thead><tbody>';\n\n  topSegs.forEach(s => {\n    let total = 0;\n    const segEsc = s.replace(/'/g, \"\\\\'\");\n    html += '<tr><td class=\"row-label\" onclick=\"openDrill(\\''+segEsc+' segment\\', ACCOUNTS.filter(a => a.segment===\\''+segEsc+'\\'))\">'+s+'</td>';\n    tiers.forEach(t => {\n      const v = matrix[s][t];\n      total += v;\n      const intensity = maxVal > 0 ? v/maxVal : 0;\n      let bg = '#fafafa', color = '#c8d6d6';\n      if(v > 0){\n        if(intensity >= 0.8){bg='#0d4f4e'; color='#fff';}\n        else if(intensity >= 0.5){bg='#1b7a78'; color='#fff';}\n        else if(intensity >= 0.25){bg='#5ac8b8'; color='#0d4f4e';}\n        else {bg='#b8e0d9'; color='#0d4f4e';}\n      }\n      html += '<td class=\"cell\" style=\"background:'+bg+';color:'+color+'\" onclick=\"openDrill(\\''+segEsc+' · '+t+'\\', ACCOUNTS.filter(a => a.segment===\\''+segEsc+'\\' && a.tier===\\''+t+'\\'))\">'+(v||'—')+'</td>';\n    });\n    html += '<td style=\"font-weight:800;background:#f4f8f8;color:#0d4f4e\">'+total+'</td></tr>';\n  });\n\n  html += '<tr><td class=\"row-hdr\" style=\"background:#0d4f4e;color:#5ac8b8;font-weight:800\">TOTAL</td>';\n  tiers.forEach(t => {\n    const v = topSegs.reduce((s,seg)=>s+matrix[seg][t], 0);\n    html += '<td style=\"background:#0d4f4e;color:#5ac8b8;font-weight:800;cursor:pointer\" onclick=\"drillByName(\\''+t.toLowerCase().replace(' ','')+'\\')\">'+v+'</td>';\n  });\n  html += '<td style=\"background:#0d4f4e;color:#fff;font-weight:800\">'+topSegs.reduce((s,seg)=>s+tiers.reduce((ts,t)=>ts+matrix[seg][t],0),0)+'</td></tr>';\n  html += '</tbody></table>';\n  document.getElementById('heatmap').innerHTML = html;\n}\n\n// INIT\nrenderTierChart();\nrenderSegmentChart();\nrenderVolumeDonut();\nrenderReferencesChart();\nrenderHeatmap();\nrenderMainTable(ACCOUNTS);\n<\/script>\n</body>\n</html>", "lookalikes": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Birdie — Lookalikes Dashboard</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{background:#f4f8f8;color:#0d4f4e;min-width:320px;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.5}\n.app{display:flex;min-height:100vh}\n\n.sidebar{width:280px;background:#0d4f4e;color:#fff;padding:24px 0;position:fixed;height:100vh;overflow-y:auto}\n.sidebar .logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}\n.sidebar .logo h1{font-size:24px;font-weight:800;letter-spacing:-.02em}\n.sidebar .logo h1 .b{color:#5ac8b8}\n.sidebar .logo .sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}\n.sidebar .all-btn{margin:0 16px 16px;padding:14px 16px;background:#5ac8b8;color:#0d4f4e;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;transition:background .15s}\n.sidebar .all-btn:hover{background:#7ad5c6}\n.sidebar .all-btn.active{background:#fff;color:#0d4f4e}\n.sidebar .all-btn .badge{background:#0d4f4e;color:#5ac8b8;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:800}\n.sidebar .all-btn.active .badge{background:#0d4f4e;color:#fff}\n\n.sidebar .group{margin-bottom:18px}\n.sidebar .group-title{font-size:9px;font-weight:800;color:#5ac8b8;text-transform:uppercase;letter-spacing:.15em;border-bottom:1px solid rgba(90,200,184,.15);padding-bottom:8px;margin:0 16px 8px;display:flex;align-items:center;gap:6px}\n.sidebar .list-item{padding:9px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;transition:background .15s;margin:0 12px;border-radius:6px}\n.sidebar .list-item:hover{background:rgba(255,255,255,.08)}\n.sidebar .list-item.active{background:#5ac8b8;color:#0d4f4e}\n.sidebar .badge{background:rgba(255,255,255,.12);padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700}\n.sidebar .list-item.active .badge{background:#0d4f4e;color:#5ac8b8}\n.sidebar .tier-bar{width:4px;height:18px;margin-right:8px;border-radius:2px;display:inline-block}\n.sidebar .sub-chip{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:middle}\n\n.main{margin-left:280px;padding:32px 40px;flex:1;padding-bottom:460px}\n.page-header{margin-bottom:24px}\n.page-header h2{font-size:22px;font-weight:800;letter-spacing:-.01em}\n.page-header .subtitle{color:#6b8b8a;font-size:12px;margin-top:4px}\n\n.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}\n.kpi{background:#fff;padding:16px 14px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06);cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:3px solid transparent}\n.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(13,79,78,.12)}\n.kpi.kpi-total{border-top-color:#0d4f4e}\n.kpi.kpi-t1{border-top-color:#ff6b6b}\n.kpi.kpi-sweet{border-top-color:#7dd87d}\n.kpi.kpi-dm{border-top-color:#1b7a78}\n.kpi.kpi-champ{border-top-color:#ffb84d}\n.kpi .l{font-size:10px;color:#6b8b8a;text-transform:uppercase;letter-spacing:.08em;font-weight:700}\n.kpi .v{font-size:28px;font-weight:800;color:#0d4f4e;margin-top:4px;line-height:1}\n.kpi .d{font-size:10px;color:#6b8b8a;margin-top:2px}\n\n.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}\n.chart-card{background:#fff;padding:18px 20px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06)}\n.chart-card h3{font-size:12px;font-weight:800;color:#0d4f4e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}\n.chart-card h3 .hint{font-size:10px;color:#6b8b8a;text-transform:none;letter-spacing:0;font-weight:500}\n\n.bar-row{display:flex;align-items:center;margin-bottom:10px;cursor:pointer;padding:3px 4px;border-radius:4px;transition:background .15s}\n.bar-row:hover{background:#f4f8f8}\n.bar-label{width:130px;font-size:11px;font-weight:700;color:#0d4f4e;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;padding-right:8px;flex-shrink:0}\n.bar-track{flex:1;background:#eef4f3;height:22px;border-radius:4px;position:relative;overflow:hidden}\n.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-width:28px;transition:width .3s}\n.bar-value{font-size:11px;color:#0d4f4e;font-weight:800;margin-left:8px;min-width:24px;text-align:right;flex-shrink:0}\n\n.donut-wrap{display:flex;align-items:center;gap:24px}\n.donut-svg{flex-shrink:0}\n.donut-legend{flex:1;display:flex;flex-direction:column;gap:8px}\n.donut-legend .legend-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border-radius:4px;transition:background .15s}\n.donut-legend .legend-row:hover{background:#f4f8f8}\n.donut-legend .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}\n.donut-legend .legend-label{flex:1;font-size:11px;font-weight:700;color:#0d4f4e}\n.donut-legend .legend-value{font-size:11px;font-weight:800;color:#0d4f4e}\n.donut-legend .legend-pct{font-size:10px;color:#6b8b8a;margin-left:6px}\n\n.heatmap-wrap{overflow-x:auto}\n.heatmap{border-collapse:collapse;font-size:10px;width:100%}\n.heatmap th{padding:6px 8px;text-align:center;color:#0d4f4e;font-weight:800;text-transform:uppercase;letter-spacing:.03em it;text-transform:uppercase;letter-spacing:.05em}\n.drill-h .btns button:hover{background:#5ac8b8;color:#0d4f4e}\n.drill-body{overflow-y:auto;max-height:calc(100% - 50px)}\n.drill-body .tbl-wrap{border-radius:0;box-shadow:none;padding:0}\n\n@media (max-width:1200px){\n  .main{padding:24px 24px;padding-bottom:460px}\n  .kpis{grid-template-columns:repeat(3,1fr)}\n  .charts-row{grid-template-columns:1fr}\n}\n@media (max-width:900px){\n  .app{flex-direction:column}\n  .sidebar{position:relative;width:100%;height:auto;padding:16px 18px}\n  .sidebar .logo{margin-bottom:12px;padding-bottom:12px}\n  .sidebar .all-btn{margin:0 0 12px;padding:10px 14px;font-size:12px}\n  .sidebar .group{margin-bottom:12px}\n  .sidebar .group-title{padding:0;margin:10px 0 6px;font-size:9px;border:none;display:block}\n  .sidebar .list-item{display:inline-flex;margin:3px 6px 3px 0;padding:5px 10px;font-size:11px;border-radius:6px;background:rgba(255,255,255,.08);white-space:nowrap}\n  .sidebar .list-item .tier-bar{height:10px;width:3px;margin-right:5px}\n  .main{margin-left:0;padding:20px 18px;padding-bottom:20px}\n  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}\n  .page-header h2{font-size:18px}\n  .drill{left:0}\n  .drill.open{height:100vh;top:0;bottom:0}\n  .drill-body{max-height:calc(100vh - 60px)}\n  table{font-size:11px}\n  thead th,tbody td{padding:6px 8px;white-space:nowrap}\n  .donut-wrap{flex-direction:column;align-items:stretch}\n}\n@media (max-width:600px){\n  .main{padding:16px 12px}\n  .kpis{grid-template-columns:1fr 1fr;gap:8px}\n  .kpi{padding:12px 10px}\n  .kpi .v{font-size:22px}\n  .page-header h2{font-size:16px}\n  .chart-card{padding:14px}\n  .bar-label{width:100px;font-size:10px}\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"sidebar\">\n  <div class=\"logo\">\n    <h1><span class=\"b\">b</span>irdie</h1>\n    <div class=\"sub\">Birdie Lookalikes</div>\n  </div>\n\n  <div class=\"all-btn active\" data-filter=\"all\">\n    <span>All Leads</span>\n /a>' : '—';\n  return '<tr onclick=\"openLeadDetail('+JSON.stringify(l['Lead Name']).replace(/\"/g,'&quot;')+')\">' +\n    '<td><span class=\"chip tier\" style=\"background:'+tierColor+'\">'+l._tier+'</span></td>' +\n    '<td><strong>'+(l['Total Score']||'—')+'</strong></td>' +\n    '<td><span class=\"chip sub\" style=\"background:'+subColor+'\">'+l._sub+'</span></td>' +\n    '<td><strong>'+(l['Lead Name']||'')+'</strong></td>' +\n    '<td>'+(l['Job Title']||'')+'</td>' +\n    '<td>'+(l['Company']||'')+'</td>' +\n    '<td>'+(l['Size']||'—')+'<br><span style=\"color:#6b8b8a;font-size:10px\">'+(l['Size Label']||'')+'</span></td>' +\n    '<td><span class=\"chip campaign\">'+(CAMP_SHORT[l['Campaign']]||l['Campaign']||'')+'</span></td>' +\n    '<td>'+(l['City']||'—')+'<br><span style=\"color:#6b8b8a;font-size:10px\">'+(l['Country']||'')+'</span></td>' +\n    '<td>'+linkedin+'</td></tr>';\n}\n\nfunction renderMainTable(rows){\n  const tbody = document.getElementById('main-tbody');\n  const sorted = [...rows].sort((a,b) => tierPriority(a._tier) - tierPriority(b._tier) || (b['Total Score']||0) - (a['Total Score']||0));\n  tbody.innerHTML = sorted.map(buildRow).join('');\n}\n\nfunction openDrill(title, rows){\n  drillData = rows;\n  document.getElementById('drill-title').textContent = title + ' (' + rows.length + ')';\n  const body = document.getElementById('drill-body');\n  if(rows.length === 0){\n    body.innerHTML = '<div style=\"padding:24px;color:#6b8b8a\">No leads matched this filter.</div>';\n  } else {\n    let html = '<div class=\"tbl-wrap\"><table><thead><tr>' +\n      '<th>Tier</th><th>Score</th><th>Sub</th><th>Lead</th><th>Title</th><th>Company</th>' +\n      '<th>Size</th><th>Campaign</th><th>Location</th><th>LinkedIn</th>' +\n      '</tr></thead><tbody>';\n    const sorted = [...rows].sort((a,b) => tierPriority(a._tier) - tierPriority(b._tier) || (b['Total Score']||0) - (a['Total Score']||0));\n    sorted.forEach(l => { html += buildRow(l); });\n    html += '</tbody></table></div>';\n    body.innerHTML = html;\n  }\n  document.getElementById('drill').classList.add('open');\n}\n\nfunction drillByName(key){\n  const map = {\n    'all': ['All Leads', LEADS],\n    'tier1': ['🏆 Tier 1 — Hot', LEADS.filter(l => l._tier==='Tier 1')],\n    'tier2': ['🔥 Tier 2 — Warm', LEADS.filter(l => l._tier==='Tier 2')],\n    'tier3': ['⚡ Tier 3 — Nurture', LEADS.filter(l => l._tier==='Tier 3')],\n    'tier4': ['❄️ Tier 4 — Cold', LEADS.filter(l => l._tier==='Tier 4')],\n    'sweet': ['🟢 Sweet Spot', LEADS.filter(l => (l['Size Label']||'').includes('🟢'))],\n    'dm': ['Decision Makers (DM-A/B/C)', LEADS.filter(l => l._sub.startsWith('DM-'))],\n    'champ': ['Champions (A/B/C)', LEADS.filter(l => l._sub.startsWith('Champion'))],\n  };\n  const [title, rows] = map[key];\n  openDrill(title, rows);\n}\n\nfunction openLeadDetail(name){\n  const l = LEADS.find(x => x['Lead Name'] === name);\n  if(!l) return;\n  const tierColor = TIER_COLORS[l._tier] || '#6b8b8a';\n  const subColor = SUB_COLORS[l._sub] || '#6b8b8a';\n  const linkedin = l.LinkedIn ? '<a href=\"'+l.LinkedIn+'\" target=\"_blank\" rel=\"noopener\" style=\"color:#1b7a78;font-weight:700\">'+l.LinkedIn+' →</a>' : '—';\n\n  const detail = '<div style=\"padding:20px 24px\">' +\n    '<div style=\"display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap;margin-bottom:16px\">' +\n      '<div><h3 style=\"font-size:20px;color:#0d4f4e;font-weight:800\">'+l['Lead Name']+'</h3>' +\n      '<div style=\"color:#1b7a78;font-size:14px;margin-top:4px;font-weight:600\">'+(l['Job Title']||'')+'</div>' +\n      '<div style=\"color:#6b8b8a;font-size:13px;margin-top:4px\">'+(l['Company']||'')+' · '+(l['City']||'')+', '+(l['Country']||'')+'</div>' +\n      '<div style=\"margin-top:8px\">'+linkedin+'</div></div>' +\n      '<div style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-end\">' +\n      '<span class=\"chip tier\" style=\"background:'+tierColor+';padding:6px 14px;font-size:12px\">'+l._tier+' · Score '+l['Total Score']+'</span>' +\n      '<span class=\"chip sub\" style=\"background:'+subColor+';padding:5px 12px;font-size:11px\">'+l._sub+'</span>' +\n      '</div></div>' +\n\n    '<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px\">' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">Title Score</div><div style=\"font-size:22px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+(l['Title Score']||0)+'</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">'+l._sub+' weight</div></div>' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">Size Score</div><div style=\"font-size:22px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+(l['Size Score']||0)+'</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">'+(l['Size Label']||'')+'</div></div>' +\n      '<div style=\"background:#f4f8f8;padding:12px;border-radius:6px\"><div style=\"font-size:10px;color:#6b8b8a;text-transform:uppercase;font-weight:700\">Total Score</div><div style=\"font-size:22px;color:#0d4f4e;font-weight:800;margin-top:4px\">'+(l['Total Score']||0)+'</div><div style=\"font-size:10px;color:#6b8b8a;margin-top:4px\">title + size</div></div>' +\n    '</div>' +\n\n    '<div style=\"margin-top:14px;padding:12px;background:#0d4f4e;border-radius:6px;color:#fff\">' +\n      '<div style=\"font-size:10px;color:#5ac8b8;text-transform:uppercase;font-weight:700\">Campaign Source</div>' +\n      '<div style=\"font-size:14px;margin-top:4px;font-weight:700\">'+(l['Campaign']||'—')+'</div>' +\n      '<div style=\"font-size:11px;color:rgba(255,255,255,.7);margin-top:2px\">Creation: '+(l['Creation Date']||'—')+'</div>' +\n    '</div>' +\n\n    '<div style=\"margin-top:14px;padding:12px;background:#e7f7f3;border-left:3px solid #0d4f4e;border-radius:4px\">' +\n      '<div style=\"font-size:10px;color:#0d4f4e;text-transform:uppercase;font-weight:700\">Company Info</div>' +\n      '<div style=\"font-size:13px;margin-top:4px;color:#0d4f4e\"><strong>'+(l['Company']||'')+'</strong></div>' +\n      '<div style=\"font-size:11px;color:#1b7a78;margin-top:2px\">Size: '+(l['Size']||'—')+' · '+(l['Size Label']||'')+'</div>' +\n    '</div>' +\n  '</div>';\n\n  document.getElementById('drill-title').textContent = l['Lead Name'] + ' — Lead Detail';\n  document.getElementById('drill-body').innerHTML = detail;\n  drillData = [l];\n  document.getElementById('drill').classList.add('open');\n}\n\nfunction closeDrill(){document.getElementById('drill').classList.remove('open');}\n\nfunction exportDrill(){\n  if(drillData.length === 0) return;\n  const cols = ['Tier','Sub-classification','Segment','Total Score','Title Score','Size Score',\n                'Lead Name','Job Title','Company','Size','Size Label',\n                'Campaign','Country','City','Creation Date','LinkedIn'];\n  const rows = drillData.map(l => [\n    l._tier, l._sub, l._seg, l['Total Score'], l['Title Score'], l['Size Score'],\n    l['Lead Name'], l['Job Title'], l['Company'], l['Size'], l['Size Label'],\n    l['Campaign'], l['Country'], l['City'], l['Creation Date'], l['LinkedIn']\n  ]);\n  const csv = [cols, ...rows].map(r => r.map(v => {\n    v = v == null ? '' : String(v);\n    if(v.includes(',') || v.includes('\"') || v.includes('\\n')) return '\"'+v.replace(/\"/g,'\"\"')+'\"';\n    return v;\n  }).join(',')).join('\\n');\n  const blob = new Blob(['\\ufeff'+csv], {type:'text/csv;charset=utf-8'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'birdie_q1_leads_' + Date.now() + '.csv';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\n// Sidebar clicks\ndocument.querySelectorAll('.sidebar .list-item, .sidebar .all-btn').forEach(el => {\n  el.addEventListener('click', () => {\n    document.querySelectorAll('.sidebar .list-item, .sidebar .all-btn').forEach(e => e.classList.remove('active'));\n    el.classList.add('active');\n    const filter = el.dataset.filter;\n    const val = el.dataset.val;\n    let title, rows;\n    if(filter === 'all'){title='All Leads'; rows=LEADS;}\n    else if(filter === 'tier'){title=val; rows=LEADS.filter(l => l._tier === val);}\n    else if(filter === 'sub'){title=val; rows=LEADS.filter(l => l._sub === val);}\n    else if(filter === 'camp'){title=CAMP_SHORT[val]||val; rows=LEADS.filter(l => l['Campaign'] === val);}\n    renderMainTable(rows);\n    openDrill(title, rows);\n  });\n});\n\n// CHART: Tier bar\nfunction renderTierChart(){\n  const data = [\n    {label:'🏆 Tier 1', count:LEADS.filter(l=>l._tier==='Tier 1').length, color:'#0d4f4e', key:'tier1'},\n    {label:'🔥 Tier 2', count:LEADS.filter(l=>l._tier==='Tier 2').length, color:'#1b7a78', key:'tier2'},\n    {label:'⚡ Tier 3', count:LEADS.filter(l=>l._tier==='Tier 3').length, color:'#5ac8b8', key:'tier3'},\n    {label:'❄️ Tier 4', count:LEADS.filter(l=>l._tier==='Tier 4').length, color:'#c8d6d6', key:'tier4'},\n  ];\n  const max = Math.max(...data.map(d=>d.count), 1);\n  const el = document.getElementById('chart-tier');\n  el.innerHTML = data.map(d => {\n    const w = (d.count/max*100).toFixed(1);\n    const pct = LEADS.length > 0 ? Math.round(d.count/LEADS.length*100) : 0;\n    return '<div class=\"bar-row\" onclick=\"drillByName(\\''+d.key+'\\')\">' +\n      '<div class=\"bar-label\">'+d.label+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:'+d.color+'\">'+d.count+'</div></div>' +\n      '<div class=\"bar-value\">'+pct+'%</div>' +\n    '</div>';\n  }).join('');\n}\n\n// CHART: Campaign donut\nfunction renderCampaignDonut(){\n  const data = [\n    {label:'CX Dinner', count:LEADS.filter(l=>l['Campaign']==='CX DINNER | LINKEDIN').length, color:'#0d4f4e', full:'CX DINNER | LINKEDIN'},\n    {label:'CCO Summit', count:LEADS.filter(l=>l['Campaign']==='CCO SUMMIT | LINKEDIN').length, color:'#1b7a78', full:'CCO SUMMIT | LINKEDIN'},\n    {label:'CX Case Maker', count:LEADS.filter(l=>l['Campaign']==='CX CASE MAKER | LINKEDIN').length, color:'#ffb84d', full:'CX CASE MAKER | LINKEDIN'},\n  ];\n  const total = data.reduce((s,d)=>s+d.count, 0);\n  const svg = document.getElementById('donut-camp');\n  const cx=80, cy=80, r=60, ir=38;\n  let a0 = -Math.PI/2;\n  let paths = '';\n  data.forEach(d => {\n    if(d.count===0) return;\n    const a1 = a0 + (d.count/total)*2*Math.PI;\n    const large = (a1-a0) > Math.PI ? 1 : 0;\n    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);\n    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);\n    const xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);\n    const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1);\n    paths += '<path d=\"M '+x0+' '+y0+' A '+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' L '+xi1+' '+yi1+' A '+ir+' '+ir+' 0 '+large+' 0 '+xi0+' '+yi0+' Z\" fill=\"'+d.color+'\" style=\"cursor:pointer\" onclick=\"openDrill(\\''+d.label+'\\', LEADS.filter(l => l.Campaign===\\''+d.full+'\\'))\"><title>'+d.label+': '+d.count+'</title></path>';\n    a0 = a1;\n  });\n  svg.innerHTML = paths + '<text x=\"'+cx+'\" y=\"'+(cy-4)+'\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"#0d4f4e\">'+total+'</text><text x=\"'+cx+'\" y=\"'+(cy+16)+'\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6b8b8a\" letter-spacing=\"1\">TOTAL</text>';\n\n  const legend = document.getElementById('donut-camp-legend');\n  legend.innerHTML = data.map(d => {\n    const pct = total > 0 ? (d.count/total*100).toFixed(0) : 0;\n    return '<div class=\"legend-row\" onclick=\"openDrill(\\''+d.label+'\\', LEADS.filter(l => l.Campaign===\\''+d.full+'\\'))\">' +\n      '<div class=\"legend-dot\" style=\"background:'+d.color+'\"></div>' +\n      '<div class=\"legend-label\">'+d.label+'</div>' +\n      '<div class=\"legend-value\">'+d.count+'</div><div class=\"legend-pct\">('+pct+'%)</div>' +\n    '</div>';\n  }).join('');\n}\n\n// CHART: Sub-classification bar\nfunction renderSubChart(){\n  const counts = {};\n  LEADS.forEach(l => { counts[l._sub] = (counts[l._sub]||0)+1; });\n  const sorted = Object.entries(counts).sort((a,b) => subPriority(a[0]) - subPriority(b[0]));\n  const max = Math.max(...sorted.map(x=>x[1]), 1);\n  const el = document.getElementById('chart-sub');\n  el.innerHTML = sorted.map(([sub, cnt]) => {\n    const w = (cnt/max*100).toFixed(1);\n    const color = SUB_COLORS[sub] || '#6b8b8a';\n    return '<div class=\"bar-row\" onclick=\"openDrill(\\''+sub+'\\', LEADS.filter(l => l._sub===\\''+sub+'\\'))\">' +\n      '<div class=\"bar-label\">'+sub+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:'+color+'\">'+cnt+'</div></div>' +\n      '<div class=\"bar-value\">'+cnt+'</div>' +\n    '</div>';\n  }).join('');\n}\n\n// CHART: City bar\nfunction renderCityChart(){\n  const counts = {};\n  LEADS.forEach(l => { if(l.City){ counts[l.City] = (counts[l.City]||0)+1; }});\n  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 10);\n  if(sorted.length === 0){\n    document.getElementById('chart-city').innerHTML = '<div style=\"color:#6b8b8a;padding:20px;text-align:center\">No city data</div>';\n    return;\n  }\n  const max = sorted[0][1];\n  const el = document.getElementById('chart-city');\n  el.innerHTML = sorted.map(([city, cnt]) => {\n    const w = (cnt/max*100).toFixed(1);\n    return '<div class=\"bar-row\" onclick=\"openDrill(\\''+city+' (city)\\', LEADS.filter(l => l.City===\\''+city.replace(/'/g,\"\\\\\\\\'\")+'\\'))\">' +\n      '<div class=\"bar-label\">'+city+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:#1b7a78\">'+cnt+'</div></div>' +\n      '<div class=\"bar-value\">'+cnt+'</div>' +\n    '</div>';\n  }).join('');\n}\n\n// HEATMAP: Campaign × Tier\nfunction renderHeatmap(){\n  const camps = ['CX DINNER | LINKEDIN','CCO SUMMIT | LINKEDIN','CX CASE MAKER | LINKEDIN'];\n  const tiers = ['Tier 1','Tier 2','Tier 3','Tier 4'];\n  const tierLabels = {'Tier 1':'🏆 T1','Tier 2':'🔥 T2','Tier 3':'⚡ T3','Tier 4':'❄️ T4'};\n  // matriz camp × tier\n  const matrix = {};\n  camps.forEach(c => {\n    matrix[c] = {};\n    tiers.forEach(t => {\n      matrix[c][t] = LEADS.filter(l => l['Campaign']===c && l._tier===t).length;\n    });\n  });\n  // max global para intensidade de cor\n  let maxVal = 0;\n  camps.forEach(c => tiers.forEach(t => { if(matrix[c][t] > maxVal) maxVal = matrix[c][t]; }));\n\n  let html = '<table class=\"heatmap\"><thead><tr><th class=\"row-hdr\">Campaign</th>';\n  tiers.forEach(t => { html += '<th>'+tierLabels[t]+'</th>'; });\n  html += '<th>Total</th></tr></thead><tbody>';\n\n  camps.forEach(c => {\n    let total = 0;\n    html += '<tr><td class=\"row-label\" onclick=\"openDrill(\\''+CAMP_SHORT[c]+'\\', LEADS.filter(l => l.Campaign===\\''+c+'\\'))\">'+CAMP_SHORT[c]+'</td>';\n    tiers.forEach(t => {\n      const v = matrix[c][t];\n      total += v;\n      // intensidade: 0 = branco, maxVal = verde escuro Birdie\n      const intensity = maxVal > 0 ? v/maxVal : 0;\n      let bg = '#fafafa', color = '#c8d6d6';\n      if(v > 0){\n        // gradient Birdie: #e7f7f3 → #0d4f4e\n        if(intensity >= 0.8){bg='#0d4f4e'; color='#fff';}\n        else if(intensity >= 0.5){bg='#1b7a78'; color='#fff';}\n        else if(intensity >= 0.25){bg='#5ac8b8'; color='#0d4f4e';}\n        else {bg='#b8e0d9'; color='#0d4f4e';}\n      }\n      html += '<td class=\"cell\" style=\"background:'+bg+';color:'+color+'\" onclick=\"openDrill(\\''+CAMP_SHORT[c]+' · '+tierLabels[t]+'\\', LEADS.filter(l => l.Campaign===\\''+c+'\\' && l._tier===\\''+t+'\\'))\">'+(v||'—')+'</td>';\n    });\n    html += '<td style=\"font-weight:800;background:#f4f8f8;color:#0d4f4e\">'+total+'</td></tr>';\n  });\n\n  // Linha de totais por tier\n  html += '<tr><td class=\"row-hdr\" style=\"background:#0d4f4e;color:#5ac8b8;font-weight:800\">TOTAL</td>';\n  tiers.forEach(t => {\n    const v = camps.reduce((s,c)=>s+matrix[c][t], 0);\n    html += '<td style=\"background:#0d4f4e;color:#5ac8b8;font-weight:800;cursor:pointer\" onclick=\"drillByName(\\''+t.toLowerCase().replace(' ','')+'\\')\">'+v+'</td>';\n  });\n  html += '<td style=\"background:#0d4f4e;color:#fff;font-weight:800\">'+LEADS.length+'</td></tr>';\n  html += '</tbody></table>';\n  document.getElementById('heatmap').innerHTML = html;\n}\n\n// INIT\nrenderTierChart();\nrenderCampaignDonut();\nrenderSubChart();\nrenderCityChart();\nrenderHeatmap();\nrenderMainTable(LEADS);\n<\/script>\n</body>\n</html>"}}</script>

<script>
(function(){
  'use strict';
  var payload, data;
  try {
    var el = document.getElementById('birdie-payload');
    payload = el.textContent || el.innerText;
    data = JSON.parse(payload);
  } catch(e) {
    document.getElementById('err-msg').textContent = 'Payload parse error: ' + e.message;
    document.getElementById('err').classList.add('show');
    console.error('Payload parse error', e);
    return;
  }
  var TABS = data.tabs;
  var DASHBOARDS = data.dashboards;
  var tabsEl = document.getElementById('tabs');
  var frame = document.getElementById('frame');
  var loading = document.getElementById('loading');
  var errEl = document.getElementById('err');
  var currentId = null;

  function renderTabs(){
    var html = '';
    for(var i=0; i<TABS.length; i++){
      var t = TABS[i];
      html += '<div class="tab" data-id="'+t.id+'">' +
        '<div><span class="t-icon">'+t.icon+'</span><span class="t-label">'+t.label+'</span></div>' +
        '<div class="t-sub">'+t.sub+'</div>' +
      '</div>';
    }
    tabsEl.innerHTML = html;
    var nodes = document.querySelectorAll('.tab');
    for(var j=0; j<nodes.length; j++){
      nodes[j].addEventListener('click', (function(el){
        return function(){ switchTab(el.dataset.id); };
      })(nodes[j]));
    }
  }

  function switchTab(id){
    if(id === currentId) return;
    if(!DASHBOARDS[id]){
      document.getElementById('err-msg').textContent = 'Dashboard not found: ' + id;
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    currentId = id;
    var nodes = document.querySelectorAll('.tab');
    for(var i=0; i<nodes.length; i++){
      nodes[i].classList.toggle('active', nodes[i].dataset.id === id);
    }
    loading.classList.add('show');
    frame.onload = function(){ loading.classList.remove('show'); };
    frame.srcdoc = DASHBOARDS[id];
    try { history.replaceState(null, '', '#' + id); } catch(e){}
  }

  window.openCurrentInNewTab = function(){};

  renderTabs();
  var initialId = (location.hash || '').replace('#', '') || TABS[0].id;
  var valid = false;
  for(var k=0; k<TABS.length; k++){ if(TABS[k].id === initialId){ valid = true; break; } }
  switchTab(valid ? initialId : TABS[0].id);
})();
</script>
</body>
