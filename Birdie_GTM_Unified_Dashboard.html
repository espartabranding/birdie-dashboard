classList.add('active');\n    activeSec=el.dataset.sec;\n    render();\n  });\n});\n\nfunction render(){\n  document.getElementById('ph-title').textContent=\n    activeSec.charAt(0).toUpperCase()+activeSec.slice(1)+' — '+activeList;\n  renderKpis();\n  if(activeSec==='overview')renderOverview();\n  else if(activeSec==='classification')renderClassification();\n  else if(activeSec==='icp')renderICP();\n  else if(activeSec==='geo')renderGeo();\n  else if(activeSec==='firmographics')renderFirmographics();\n  else if(activeSec==='table')renderTable();\n}\n\nfunction renderKpis(){\n  const d=activeDataset;\n  const total=d.length;\n  const t1=d.filter(x=>x.tier==='Tier 1').length;\n  const dmA=d.filter(x=>x.sub==='DM-A').length;\n  const dmB=d.filter(x=>x.sub==='DM-B').length;\n  const prio=d.filter(x=>x.rec==='Prioritize').length;\n  const avgICP=total?Math.round(d.reduce((a,b)=>a+b.icp,0)/total):0;\n  document.getElementById('kpis').innerHTML=`\n    <div class=\"kpi\" onclick=\"drillKpi('total')\"><div class=\"v\">${total}</div><div class=\"l\">Total Leads</div></div>\n    <div class=\"kpi\" onclick=\"drillKpi('dm')\"><div class=\"v\">${dmA+dmB}</div><div class=\"l\">DM-A + DM-B</div></div>\n    <div class=\"kpi\" onclick=\"drillKpi('tier1')\"><div class=\"v\">${t1}</div><div class=\"l\">Tier 1 Accounts</div></div>\n    <div class=\"kpi\" onclick=\"drillKpi('prio')\"><div class=\"v\">${prio}</div><div class=\"l\">Prioritize</div></div>\n    <div class=\"kpi\" onclick=\"drillKpi('icp')\"><div class=\"v\">${avgICP}</div><div class=\"l\">Avg ICP Score</div></div>`;\n}\n\nfunction drillKpi(which){\n  const d=activeDataset;\n  let arr, label;\n  if(which==='total'){arr=[...d].sort((a,b)=>(b.cw*.4+b.icp*.6)-(a.cw*.4+a.icp*.6));label='Total Leads (sorted by CW × 0.4 + ICP × 0.6)'}\n  else if(which==='dm'){arr=d.filter(x=>x.sub==='DM-A'||x.sub==='DM-B').sort((a,b)=>b.icp-a.icp);label='DM-A + DM-B (high priority decision makers)'}\n  else if(which==='tier1'){arr=d.filter(x=>x.tier==='Tier 1').sort((a,b)=>b.icp-a.icp);label='Tier 1 Accounts (ICP ≥ 70)'}\n  else if(which==='prio'){arr=d.filter(x=>x.rec==='Prioritize').sort((a,b)=>b.icp-a.icp);label='Prioritize — ação imediata'}\n  else if(which==='icp'){arr=[...d].sort((a,b)=>b.icp-a.icp);label='Leads sorted by ICP Score'}\n  if(arr.length===0){\n    drillData=[];\n    document.getElementById('drill-title').textContent=label+' — 0 leads';\n    document.getElementById('drill-body').innerHTML='<div style=\"padding:40px;text-align:center;color:#7a9595;font-weight:600\">No leads found in this slice.</div>';\n    document.getElementById('drill').classList.add('open');\n    return;\n  }\n  drill(arr,label);\n}\n\nfunction count(arr,key){\n  const m={};arr.forEach(x=>{const k=x[key]||'—';m[k]=(m[k]||0)+1});\n  return m;\n}\n\nfunction renderOverview(){\n  const d=activeDataset;\n  const subCounts=count(d,'sub');\n  const tierCounts=count(d,'tier');\n  const subOrder=['DM-A','DM-B','DM-C','Champion A','Champion B','Champion C','Out-A','Out-B','Out-C','Out-C (Competitor)'];\n  const tierOrder=['Tier 1','Tier 2','Tier 3','Out'];\n  const subData=subOrder.map(s=>subCounts[s]||0);\n  const tierData=tierOrder.map(t=>tierCounts[t]||0);\n  document.getElementById('content').innerHTML=`\n    <div class=\"grid\">\n      <div class=\"card\"><h3>Classification Distribution</h3><div class=\"sub\">Click for drilldown</div>\n        <div class=\"chart-container\"><canvas id=\"c1\"></canvas></div></div>\n      <div class=\"card\"><h3>Account Tier</h3><div class=\"sub\">ICP Score → Tier 1/2/3/Out</div>\n        <div class=\"chart-container\"><canvas id=\"c2\"></canvas></div></div>\n    </div>`;\n  new Chart(document.getElementById('c1'),{type:'bar',data:{labels:subOrder,datasets:[{data:subData,\n    backgroundColor:[COLORS.DM_A,COLORS.DM_B,COLORS.DM_C,COLORS.ChA,COLORS.ChB,COLORS.ChC,COLORS.OutA,COLORS.OutB,COLORS.OutC,COLORS.comp]}]},\n    options:{indexAxis:'y',plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const s=subOrder[el[0].index];drill(d.filter(x=>x.sub===s),'Classification: '+s)}}}});\n  new Chart(document.getElementById('c2'),{type:'doughnut',data:{labels:tierOrder,datasets:[{data:tierData,\n    backgroundColor:[COLORS.T1,COLORS.T2,COLORS.T3,COLORS.Out]}]},\n    options:{plugins:{legend:{position:'right'}},onClick:(e,el)=>{if(el.length){const t=tierOrder[el[0].index];drill(d.filter(x=>x.tier===t),'Tier: '+t)}}}});\n}\n\nfunction renderClassification(){\n  const d=activeDataset;\n  const roles=['DM-A','DM-B','DM-C','Champion A','Champion B','Champion C','Out-A','Out-B','Out-C','Out-C (Competitor)'];\n  const roleColors=[COLORS.DM_A,COLORS.DM_B,COLORS.DM_C,COLORS.ChA,COLORS.ChB,COLORS.ChC,COLORS.OutA,COLORS.OutB,COLORS.OutC,COLORS.comp];\n  const counts=roles.map(r=>d.filter(x=>x.sub===r).length);\n  const weights=roles.map(r=>{const a=d.filter(x=>x.sub===r);return a.length?Math.round(a.reduce((s,x)=>s+x.cw,0)/a.length):0});\n  document.getElementById('content').innerHTML=`\n    <div class=\"grid\">\n      <div class=\"card chart-lg\"><h3>Role Volume</h3><div class=\"sub\">Ruler order: DM → Champion → Out · click for drilldown</div>\n        <div class=\"chart-container\" style=\"height:360px\"><canvas id=\"c1\"></canvas></div></div>\n      <div class=\"card chart-lg\"><h3>Average Role Weight</h3><div class=\"sub\">Average weight per category (0–40) · Out-A/B/C have low weight by definition</div>\n        <div class=\"chart-container\" style=\"height:320px\"><canvas id=\"c2\"></canvas></div></div>\n    </div>`;\n  new Chart(document.getElementById('c1'),{type:'bar',data:{labels:roles,datasets:[{data:counts,\n    backgroundColor:roleColors}]},\n    options:{plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const r=roles[el[0].index];drill(d.filter(x=>x.sub===r),'Role: '+r)}}}});\n  new Chart(document.getElementById('c2'),{type:'bar',data:{labels:roles,datasets:[{data:weights,\n    backgroundColor:roleColors}]},options:{plugins:{legend:{display:false}}}});\n}\n\nfunction renderICP(){\n  const d=activeDataset;\n  const buckets=[[0,20],[21,40],[41,60],[61,80],[81,100]];\n  const labels=['0-20','21-40','41-60','61-80','81-100'];\n  const data=buckets.map(([a,b])=>d.filter(x=>x.icp>=a&&x.icp<=b).length);\n  const dims=['D1 Market','D2 Size','D3 Stage','D4 Intent'];\n  const avgs=['d1','d2','d3','d4'].map(k=>d.length?Math.round(d.reduce((s,x)=>s+x[k],0)/d.length*10)/10:0);\n  const maxs=[30,25,25,20];\n  const pcts=avgs.map((a,i)=>Math.round(a/maxs[i]*100));\n  document.getElementById('content').innerHTML=`\n    <div class=\"grid\">\n      <div class=\"card\"><h3>ICP Score Distribution</h3><div class=\"sub\">0-100 in 5 buckets · click for drilldown</div>\n        <div class=\"chart-container\"><canvas id=\"c1\"></canvas></div></div>\n      <div class=\"card\"><h3>Average Utilization by Dimension</h3><div class=\"sub\">% of each dimension cap</div>\n        <div class=\"chart-container\"><canvas id=\"c2\"></canvas></div></div>\n    </div>`;\n  new Chart(document.getElementById('c1'),{type:'bar',data:{labels,datasets:[{data,\n    backgroundColor:[COLORS.Out,COLORS.T3,COLORS.T2,COLORS.T1,COLORS.DM_A]}]},\n    options:{plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const [a,b]=buckets[el[0].index];drill(d.filter(x=>x.icp>=a&&x.icp<=b),'ICP '+labels[el[0].index])}}}});\n  new Chart(document.getElementById('c2'),{type:'radar',data:{labels:dims,\n    datasets:[{label:'% do teto',data:pcts,backgroundColor:'rgba(27,122,120,.2)',borderColor:COLORS.DM_B,borderWidth:2,pointBackgroundColor:COLORS.DM_A}]},\n    options:{scales:{r:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});\n}\n\nfunction renderGeo(){\n  const d=activeDataset;\n  const ccMap=count(d,'cy');\n  const sorted=Object.entries(ccMap).sort((a,b)=>b[1]-a[1]).slice(0,15);\n  const labels=sorted.map(x=>x[0]);const values=sorted.map(x=>x[1]);\n  document.getElementById('content').innerHTML=`\n    <div class=\"card chart-lg\"><h3>Top 15 Countries</h3><div class=\"sub\">Click for drilldown</div>\n      <div class=\"chart-container\" style=\"height:400px\"><canvas id=\"c1\"></canvas></div></div>`;\n  new Chart(document.getElementById('c1'),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:COLORS.DM_B}]},\n    options:{indexAxis:'y',plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const c=labels[el[0].index];drill(d.filter(x=>x.cy===c),'Country: '+c)}}}});\n}\n\nfunction renderFirmographics(){\n  const d=activeDataset;\n  const sizes=['1-10','11-50','51-200','201-500','501-1,000','1,001-5,000','5,001-10,000','10,001+'];\n  const sizeCounts=sizes.map(s=>d.filter(x=>x.sz&&x.sz.includes(s)).length);\n  const revs=['0-5M','5M-10M','10M-25M','25M-75M','75M-200M','200M-500M','500M-1B','1B-10B','10B+'];\n  const revCounts=revs.map(r=>d.filter(x=>x.rv&&x.rv.includes(r)).length);\n  const indMap=count(d.filter(x=>x.ind),'ind');\n  const topInd=Object.entries(indMap).sort((a,b)=>b[1]-a[1]).slice(0,10);\n  document.getElementById('content').innerHTML=`\n    <div class=\"grid\">\n      <div class=\"card\"><h3>Company Size</h3><div class=\"sub\">Sweet spot: 501-5,000</div>\n        <div class=\"chart-container\"><canvas id=\"c1\"></canvas></div></div>\n      <div class=\"card\"><h3>Annual Revenue</h3>\n        <div class=\"chart-container\"><canvas id=\"c2\"></canvas></div></div>\n      <div class=\"card chart-lg\"><h3>Top 10 Industries</h3>\n        <div class=\"chart-container\"><canvas id=\"c3\"></canvas></div></div>\n    </div>`;\n  new Chart(document.getElementById('c1'),{type:'bar',data:{labels:sizes,datasets:[{data:sizeCounts,\n    backgroundColor:sizes.map(s=>(s==='501-1,000'||s==='1,001-5,000')?COLORS.DM_A:COLORS.T3)}]},\n    options:{plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const s=sizes[el[0].index];drill(d.filter(x=>x.sz&&x.sz.includes(s)),'Size: '+s)}}}});\n  new Chart(document.getElementById('c2'),{type:'bar',data:{labels:revs,datasets:[{data:revCounts,backgroundColor:COLORS.DM_B}]},\n    options:{plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const r=revs[el[0].index];drill(d.filter(x=>x.rv&&x.rv.includes(r)),'Revenue: '+r)}}}});\n  new Chart(document.getElementById('c3'),{type:'bar',data:{labels:topInd.map(x=>x[0]),datasets:[{data:topInd.map(x=>x[1]),backgroundColor:COLORS.DM_B}]},\n    options:{indexAxis:'y',plugins:{legend:{display:false}},onClick:(e,el)=>{if(el.length){const i=topInd[el[0].index][0];drill(d.filter(x=>x.ind===i),'Industry: '+i)}}}});\n}\n\nfunction renderTable(){\n  // Rank interno usa CW*.4 + ICP*.6 mas NÃO exibe os valores na tabela\n  const d=[...activeDataset].sort((a,b)=>(b.cw*.4+b.icp*.6)-(a.cw*.4+a.icp*.6));\n  const rows=d.map(x=>`<tr>\n    <td>${x.ms==='Yes'?'<span style=\"color:#d4a93a;font-weight:900;font-size:14px\" title=\"Multi-source (high intent)\">★</span>':''}</td>\n    <td><strong>${x.n}</strong></td><td>${x.t}</td><td>${x.co}</td><td>${x.cy}</td>\n    <td>${x.ind||''}</td><td>${x.sz||''}</td>\n    <td><span class=\"tag t-${x.sub.replace(/ /g,'-').replace('(Competitor)','')}\">${x.sub}</span></td>\n    <td>${x.rec}</td><td>${x.li?'<a href=\"'+x.li+'\" target=\"_blank\">LinkedIn ↗</a>':''}</td>\n  </tr>`).join('');\n  document.getElementById('content').innerHTML=`\n    <div class=\"card chart-lg\">\n      <div class=\"tools\"><button onclick=\"exportCSV(activeDataset,'${activeList}_leads')\">Export CSV</button>\n        <span style=\"font-size:12px;color:#5a7a7a\">${d.length} leads · ★ = Multi-source (high intent)</span></div>\n      <div style=\"max-height:600px;overflow-y:auto\">\n      <table>\n        <thead><tr><th>★</th><th>Name</th><th>Title</th><th>Company</th><th>Country</th><th>Industry</th><th>Size</th><th>Sub-class</th><th>Recommendation</th><th>LinkedIn</th></tr></thead>\n        <tbody>${rows}</tbody>\n      </table></div>\n    </div>`;\n}\n\nfunction drill(arr,label){\n  drillData=arr;\n  document.getElementById('drill-title').textContent=label+' — '+arr.length+' leads';\n  // Rank interno usa ICP mas não exibe\n  const rows=arr.sort((a,b)=>b.icp-a.icp).map(x=>`<tr>\n    <td>${x.ms==='Yes'?'<span style=\"color:#d4a93a;font-weight:900\" title=\"Multi-source\">★</span>':''}</td>\n    <td><strong>${x.n}</strong></td><td>${x.t}</td><td>${x.co}</td><td>${x.cy}</td>\n    <td>${x.ind||''}</td><td>${x.sz||''}</td>\n    <td><span class=\"tag t-${x.sub.replace(/ /g,'-').replace('(Competitor)','')}\">${x.sub}</span></td>\n    <td>${x.rec}</td>\n    <td>${x.li?'<a href=\"'+x.li+'\" target=\"_blank\">↗</a>':''}</td>\n  </tr>`).join('');\n  document.getElementById('drill-body').innerHTML=`<table>\n    <thead><tr><th>★</th><th>Name</th><th>Title</th><th>Company</th><th>Country</th><th>Industry</th><th>Size</th><th>Sub-class</th><th>Rec</th><th>LI</th></tr></thead>\n    <tbody>${rows}</tbody></table>`;\n  document.getElementById('drill').classList.add('open');\n}\nfunction closeDrill(){document.getElementById('drill').classList.remove('open')}\nfunction exportDrill(){exportCSV(drillData,'drill_'+Date.now())}\nfunction exportCSV(arr,fname){\n  const cols=['ms','n','t','co','cy','li','dm','sz','ind','rv','sub','rec','src'];\n  const hdr=['Multi-Source','Name','Title','Company','Country','LinkedIn','Domain','Size','Industry','Revenue','Sub-class','Recommendation','Source'];\n  const csv=[hdr.join(',')].concat(arr.map(x=>cols.map(c=>{\n    const v=x[c]===undefined?'':x[c];return typeof v==='string'&&(v.includes(',')||v.includes('\"'))?'\"'+v.replace(/\"/g,'\"\"')+'\"':v;\n  }).join(','))).join('\\n');\n  const b=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');\n  a.href=URL.createObjectURL(b);a.download=fname+'.csv';a.click();\n}\n\nrender();\n<\/script>\n</body></html>", "communities": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Birdie — Community CX Signals Dashboard</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{background:#f4f8f8;color:#0d4f4e;min-width:320px;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.5}\n.app{display:flex;min-height:100vh}\n.sidebar{width:260px;background:#0d4f4e;color:#fff;padding:24px 0;position:fixed;height:100vh;overflow-y:auto}\n.sidebar .logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}\n.sidebar .logo h1{font-size:24px;font-weight:800;letter-spacing:-.02em}\n.sidebar .logo h1 .b{color:#5ac8b8}\n.sidebar .logo .sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}\n.sidebar .section-title{padding:0 20px;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px}\n.sidebar .list-item,.sidebar .nav-item{padding:10px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;transition:background .2s}\n.sidebar .list-item:hover,.sidebar .nav-item:hover{background:rgba(255,255,255,.06)}\n.sidebar .list-item.active,.sidebar .nav-item.active{background:#5ac8b8;color:#0d4f4e}\n.sidebar .badge{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}\n.sidebar .list-item.active .badge,.sidebar .nav-item.active .badge{background:#0d4f4e;color:#fff}\n.main{margin-left:260px;padding:32px 40px;flex:1;padding-bottom:440px}\n.page-header{margin-bottom:24px}\n.page-header h2{font-size:22px;font-weight:800;letter-spacing:-.01em}\n.page-header .subtitle{color:#6b8b8a;font-size:12px;margin-top:4px}\n.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}\n.kpi{background:#fff;padding:18px 16px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06);cursor:pointer;transition:transform .15s, box-shadow .15s}\n.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(13,79,78,.12)}\n.kpi .l{font-size:10px;color:#6b8b8a;text-transform:uppercase;letter-spacing:.1em;font-weight:700}\n.kpi .v{font-size:28px;font-weight:800;color:#0d4f4e;margin-top:6px;line-height:1}\n.kpi .d{font-size:11px;color:#6b8b8a;margin-top:4px}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}\n.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06)}\n.card h3{font-size:13px;font-weight:700;color:#0d4f4e;margin-bottom:16px;text-transform:uppercase;letter-spacing:.05em}\n.lead-card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06);margin-bottom:16px;border-left:4px solid #5ac8b8}\n.lead-card .lead-top{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:12px;flex-wrap:wrap}\n.lead-card .lead-name{font-size:17px;font-weight:800;color:#0d4f4e}\n.lead-card .lead-title{font-size:13px;color:#1b7a78;margin-top:2px;font-weight:600}\n.lead-card .lead-company{font-size:12px;color:#6b8b8a;margin-top:2px}\n.lead-card .chips{display:flex;gap:6px;flex-wrap:wrap}\n.chip{display:inline-block;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}\n.chip.sub{color:#fff}\n.chip.sweet{background:#e7f7f3;color:#0d4f4e;border:1px solid #c7e9e0}\n.chip.warn{background:#fff4e0;color:#8a5a00;border:1px solid #f0d89a}\n.chip.comm{background:#0d4f4e;color:#5ac8b8;font-weight:700;cursor:pointer}\n.chip.comm:hover{background:#5ac8b8;color:#0d4f4e}\n.lead-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;margin:12px 0;padding:12px 0;border-top:1px solid #e5eeed;border-bottom:1px solid #e5eeed;font-size:11px}\n.lead-meta .m-l{color:#6b8b8a;text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:9px;margin-bottom:2px}\n.lead-meta .m-v{color:#0d4f4e;font-weight:600}\n.lead-signal{font-size:12px;color:#1b7a78;line-height:1.5;background:#f4f8f8;padding:10px 12px;border-radius:6px;margin-top:10px}\n.lead-signal .sig-l{font-size:10px;color:#6b8b8a;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px}\n.lead-actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}\n.lead-actions a{font-size:11px;font-weight:700;color:#1b7a78;text-decoration:none;padding:6px 12px;border:1px solid #c7e9e0;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}\n.lead-actions a:hover{background:#0d4f4e;color:#fff;border-color:#0d4f4e}\n.comm-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eef4f3;font-size:12px;cursor:pointer;transition:background .15s;padding-left:8px;padding-right:8px;border-radius:4px}\n.comm-row:last-child{border-bottom:none}\n.comm-row:hover{background:#f4f8f8}\n.comm-name{font-weight:700;color:#0d4f4e}\n.comm-count{background:#0d4f4e;color:#5ac8b8;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}\n.comm-count.zero{background:#eef4f3;color:#6b8b8a}\n\n/* DRILL PANEL (idêntico ao dashboard Birdie) */\n.drill{position:fixed;bottom:0;left:260px;right:0;height:0;background:#fff;box-shadow:0 -4px 20px rgba(13,79,78,.12);transition:height .3s;overflow:hidden;z-index:100}\n.drill.open{height:420px}\n.drill-h{padding:14px 24px;background:#0d4f4e;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}\n.drill-h h4{font-weight:800;font-size:14px}\n.drill-h .btns button{background:#1b7a78;color:#fff;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-weight:700;margin-left:8px;font-size:11px;font-family:inherit;text-transform:uppercase;letter-spacing:.05em}\n.drill-h .btns button:hover{background:#5ac8b8;color:#0d4f4e}\n.drill-body{overflow-y:auto;max-height:calc(100% - 50px);padding:0}\n.drill-body table{width:100%;border-collapse:collapse;font-size:12px}\n.drill-body thead th{background:#f4f8f8;color:#0d4f4e;text-transform:uppercase;letter-spacing:.05em;font-size:10px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid #e5eeed;position:sticky;top:0}\n.drill-body tbody td{padding:10px 12px;border-bottom:1px solid #eef4f3;color:#0d4f4e}\n.drill-body tbody tr:hover{background:#f4f8f8}\n.drill-body .sub-cell{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:10px;color:#fff;display:inline-block}\n.drill-body a{color:#1b7a78;text-decoration:none;font-weight:700}\n.drill-body a:hover{text-decoration:underline}\n\n/* RESPONSIVE */\n@media (max-width:1200px){\n  .main{padding:24px 24px;padding-bottom:440px}\n  .kpis{grid-template-columns:repeat(2,1fr)}\n  .grid{grid-template-columns:1fr}\n}\n@media (max-width:900px){\n  .app{flex-direction:column}\n  .sidebar{position:relative;width:100%;height:auto;padding:16px 20px}\n  .sidebar .logo{margin-bottom:12px;padding-bottom:12px}\n  .main{margin-left:0;padding:20px 18px;padding-bottom:20px}\n  .sidebar .section-title{display:inline-block;margin:8px 0 4px;font-size:10px}\n  .sidebar .list-item,.sidebar .nav-item{display:inline-flex;margin:2px 4px 2px 0;padding:6px 10px;font-size:11px;border-radius:6px;background:rgba(255,255,255,.08);white-space:nowrap}\n  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}\n  .page-header h2{font-size:18px}\n  .lead-meta{grid-template-columns:1fr 1fr}\n  .drill{left:0}\n  .drill.open{height:100vh;top:0;bottom:0}\n  .drill-body{max-height:calc(100vh - 60px)}\n}\n@media (max-width:600px){\n  .main{padding:16px 12px}\n  .kpis{grid-template-columns:1fr 1fr;gap:8px}\n  .kpi{padding:12px 10px}\n  .kpi .v{font-size:22px}\n  .lead-card{padding:16px 14px}\n  .lead-meta{grid-template-columns:1fr;gap:6px}\n  .page-header h2{font-size:16px}\n  .drill-body table{font-size:11px}\n  .drill-body thead th,.drill-body tbody td{padding:6px 8px;white-space:nowrap}\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"sidebar\">\n  <div class=\"logo\">\n    <h1><span class=\"b\">b</span>irdie</h1>\n    <div class=\"sub\">Community CX Signals</div>\n  </div>\n  <div class=\"section-title\">Source</div>\n  <div class=\"list-item active\" data-filter=\"all\"><span>All Community Leads</span><span class=\"badge\" id=\"cnt-all\">3</span></div>\n  <div class=\"section-title\">Communities</div>\n  <div class=\"list-item\" data-filter=\"comm\" data-val=\"CXPA\"><span>CXPA</span><span class=\"badge\">2</span></div>\n  <div class=\"list-item\" data-filter=\"comm\" data-val=\"ElevateCX\"><span>ElevateCX</span><span class=\"badge\">1</span></div>\n  <div class=\"list-item\" data-filter=\"comm\" data-val=\"CX Accelerator\"><span>CX Accelerator</span><span class=\"badge\">1</span></div>\n  <div class=\"list-item\" data-filter=\"comm\" data-val=\"Support Driven\"><span>Support Driven</span><span class=\"badge\">1</span></div>\n  <div class=\"section-title\">Sub-classification</div>\n  <div class=\"list-item\" data-filter=\"sub\" data-val=\"DM-A\"><span>DM-A</span><span class=\"badge\">1</span></div>\n  <div class=\"list-item\" data-filter=\"sub\" data-val=\"Champion A\"><span>Champion A</span><span class=\"badge\">1</span></div>\n  <div class=\"list-item\" data-filter=\"sub\" data-val=\"Champion B\"><span>Champion B</span><span class=\"badge\">1</span></div>\n</aside>\n\n<main class=\"main\">\n  <div class=\"page-header\">\n    <h2>Community CX Signals — Overview</h2>\n    <div class=\"subtitle\">Birdie GTM Classifier v2.4.2 · 3 leads active in 4 CX communities · click any community, sub-class or KPI to drill down</div>\n  </div>\n\n  <div class=\"kpis\">\n    <div class=\"kpi\" onclick=\"openDrill('All Leads', LEADS)\"><div class=\"l\">Total Leads</div><div class=\"v\">3</div><div class=\"d\">active in CX communities</div></div>\n    <div class=\"kpi\" onclick=\"openDrill('Decision Makers', LEADS.filter(l => l.sub.startsWith('DM-')))\"><div class=\"l\">Decision Makers</div><div class=\"v\">1</div><div class=\"d\">DM-A/B/C</div></div>\n    <div class=\"kpi\" onclick=\"openDrill('Champions', LEADS.filter(l => l.sub.startsWith('Champion')))\"><div class=\"l\">Champions</div><div class=\"v\">2</div><div class=\"d\">Champion A/B/C</div></div>\n    <div class=\"kpi\" onclick=\"openDrill('Sweet Spot', LEADS.filter(l => (l.size_tier||'').includes('✓')))\"><div class=\"l\">Sweet Spot</div><div class=\"v\">2</div><div class=\"d\">ICP size match</div></div>\n  </div>\n\n  <div class=\"grid\">\n    <div class=\"card\">\n      <h3>Communities Covered — click to drill</h3>\n      <div id=\"comm-list\"></div>\n    </div>\n    <div class=\"card\">\n      <h3>Sub-classification — click to drill</h3>\n      <div id=\"sub-list\"></div>\n    </div>\n  </div>\n\n  <div class=\"page-header\" style=\"margin-top:16px;margin-bottom:14px\">\n    <h2 style=\"font-size:16px\">Lead Details</h2>\n    <div class=\"subtitle\">All Community Signals · sorted by priority</div>\n  </div>\n\n  <div id=\"leads-container\"></div>\n</main>\n</div>\n\n<!-- DRILL PANEL -->\n<div class=\"drill\" id=\"drill\">\n  <div class=\"drill-h\">\n    <h4 id=\"drill-title\">Leads</h4>\n    <div class=\"btns\">\n      <button onclick=\"exportDrill()\">Export CSV</button>\n      <button onclick=\"closeDrill()\">Close ✕</button>\n    </div>\n  </div>\n  <div class=\"drill-body\" id=\"drill-body\"></div>\n</div>\n\n<script>\nconst LEADS = [\n  {\n    \"num\": 1,\n    \"segment\": \"Seg 1 · DM-A\",\n    \"sub\": \"DM-A\",\n    \"weight\": 28,\n    \"size_tier\": \"Sweet Spot ✓\",\n    \"name\": \"Gloria Gupta, RDH, MS, FCXP\",\n    \"title\": \"Sr Director, CX, Sales and Service\",\n    \"company\": \"American Medical Association\",\n    \"size\": \"1K-5K\",\n    \"location\": \"Chicago, IL, US\",\n    \"linkedin\": \"https://www.linkedin.com/in/gloria-gupta-rdh-ms-fcxp-4760939/\",\n    \"communities\": [\n      \"CXPA\"\n    ],\n    \"activity\": \"Reacted to 2 CXPA posts in the last month; FCXP certified; CX Leader of the Year Gold Award 2025\",\n    \"revenue\": \"75M-200M\",\n    \"hq\": \"Chicago, IL\",\n    \"customer_count\": \"271,660+ members\"\n  },\n  {\n    \"num\": 2,\n    \"segment\": \"Seg 1 · DM-A\",\n    \"sub\": \"DM-A\",\n    \"weight\": 40,\n    \"size_tier\": \"Sweet Spot ✓\",\n    \"name\": \"Eric Bruce\",\n    \"title\": \"Chief Experience Officer\",\n    \"company\": \"National Gallery of Art\",\n    \"size\": \"501-1K\",\n    \"location\": \"Washington, DC, US\",\n    \"linkedin\": \"https://www.linkedin.com/in/ericjohnbruce/\",\n    \"communities\": [\n      \"CXPA\"\n    ],\n    \"activity\": \"Reacted to CXPA posts in the last month; published in the last 30 days\",\n    \"revenue\": \"75M-200M\",\n    \"hq\": \"Washington, DC\",\n    \"customer_count\": \"Not publicly disclosed\"\n  },\n  {\n    \"num\": 3,\n    \"segment\": \"Seg 2 · Champion B\",\n    \"sub\": \"Champion B\",\n    \"weight\": 15,\n    \"size_tier\": \"Below ICP\",\n    \"name\": \"Steve Tonde\",\n    \"title\": \"Sr Support Desk Manager / Dir. CX & Support B2B SaaS\",\n    \"company\": \"PayShepherd\",\n    \"size\": \"51-200 ⚠️\",\n    \"location\": \"Toronto / Alberta, Canada\",\n    \"linkedin\": \"https://www.linkedin.com/in/steve-tonde/\",\n    \"communities\": [\n      \"CX Accelerator\",\n      \"ElevateCX\",\n      \"Support Driven\"\n    ],\n    \"activity\": \"Reacted to ElevateCX post in the last month; active member of CX Accelerator and Support Driven\",\n    \"revenue\": \"10M-25M\",\n    \"hq\": \"Calgary, Alberta\",\n    \"customer_count\": \"Not publicly disclosed\"\n  }\n];\nconst COMMS = [\"CXPA\", \"ElevateCX\", \"CX Accelerator\", \"Support Driven\"];\nconst COMM_COUNTS = {\"CXPA\": 2, \"ElevateCX\": 1, \"CX Accelerator\": 1, \"Support Driven\": 1};\nconst SUB_COLORS = {\"DM-A\": \"#0d4f4e\", \"DM-B\": \"#1b7a78\", \"DM-C\": \"#2aa198\", \"Champion A\": \"#5ac8b8\", \"Champion B\": \"#8dd4c8\", \"Champion C\": \"#b8e0d9\", \"Out-C\": \"#c8d6d6\", \"Out-C (Competitor)\": \"#a33\"};\n\nlet drillData = [];\n\nfunction priority(l){\n  const order = {'DM-A':1,'DM-B':2,'DM-C':3,'Champion A':4,'Champion B':5,'Champion C':6};\n  return order[l.sub] || 99;\n}\n\nfunction openDrill(title, rows){\n  drillData = rows;\n  document.getElementById('drill-title').textContent = title + ' (' + rows.length + ')';\n  const body = document.getElementById('drill-body');\n  if(rows.length === 0){\n    body.innerHTML = '<div style=\"padding:24px;color:#6b8b8a\">No leads matched this filter.</div>';\n  } else {\n    let html = '<table><thead><tr>' +\n      '<th>Sub</th>' +\n      '<th>Name</th>' +\n      '<th>Title</th>' +\n      '<th>Company</th>' +\n      '<th>Size</th>' +\n      '<th>Revenue</th>' +\n      '<th>Location</th>' +\n      '<th>Communities</th>' +\n      '<th>LinkedIn</th>' +\n      '</tr></thead><tbody>';\n    rows.sort((a,b) => priority(a) - priority(b)).forEach(l => {\n      const color = SUB_COLORS[l.sub] || '#0d4f4e';\n      html += '<tr>' +\n        '<td><span class=\"sub-cell\" style=\"background:'+color+'\">'+l.sub+'</span></td>' +\n        '<td><strong>'+l.name+'</strong></td>' +\n        '<td>'+(l.title||'')+'</td>' +\n        '<td>'+(l.company||'')+'</td>' +\n        '<td>'+(l.size||'')+'</td>' +\n        '<td>'+(l.revenue||'')+'</td>' +\n        '<td>'+(l.location||'')+'</td>' +\n        '<td>'+(l.communities||[]).join(', ')+'</td>' +\n        '<td><a href=\"'+l.linkedin+'\" target=\"_blank\" rel=\"noopener\">View →</a></td>' +\n        '</tr>';\n    });\n    html += '</tbody></table>';\n    body.innerHTML = html;\n  }\n  document.getElementById('drill').classList.add('open');\n}\n\nfunction closeDrill(){\n  document.getElementById('drill').classList.remove('open');\n}\n\nfunction exportDrill(){\n  if(drillData.length === 0) return;\n  const cols = ['Sub-classification','Weight','Name','Title','Company','Company Size','Annual Revenue','Location','Company HQ','Communities','Activity','LinkedIn URL'];\n  const rows = drillData.map(l => [\n    l.sub, l.weight, l.name, l.title, l.company, l.size, l.revenue,\n    l.location, l.hq, (l.communities||[]).join('; '), l.activity, l.linkedin\n  ]);\n  const csv = [cols, ...rows].map(r => r.map(v => {\n    v = v == null ? '' : String(v);\n    if(v.includes(',') || v.includes('\"') || v.includes('\\n')) return '\"'+v.replace(/\"/g,'\"\"')+'\"';\n    return v;\n  }).join(',')).join('\\n');\n  const blob = new Blob(['\\ufeff'+csv], {type:'text/csv;charset=utf-8'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'birdie_community_drill_' + Date.now() + '.csv';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\n// Sidebar: clicks em list-item acionam drill\ndocument.querySelectorAll('.sidebar .list-item').forEach(el => {\n  el.addEventListener('click', () => {\n    document.querySelectorAll('.sidebar .list-item').forEach(e => e.classList.remove('active'));\n    el.classList.add('active');\n    const filter = el.dataset.filter;\n    const val = el.dataset.val;\n    if(filter === 'all'){\n      openDrill('All Community Leads', LEADS);\n    } else if(filter === 'comm'){\n      openDrill(val + ' community', LEADS.filter(l => (l.communities||[]).includes(val)));\n    } else if(filter === 'sub'){\n      openDrill(val, LEADS.filter(l => l.sub === val));\n    }\n  });\n});\n\n// Comunidades card — click row\nconst commListEl = document.getElementById('comm-list');\nCOMMS.forEach(c => {\n  const cnt = COMM_COUNTS[c] || 0;\n  const row = document.createElement('div');\n  row.className = 'comm-row';\n  row.innerHTML = '<span class=\"comm-name\">'+c+'</span><span class=\"comm-count '+(cnt===0?'zero':'')+'\">'+cnt+' lead'+(cnt===1?'':'s')+'</span>';\n  row.addEventListener('click', () => openDrill(c + ' community', LEADS.filter(l => (l.communities||[]).includes(c))));\n  commListEl.appendChild(row);\n});\n\n// Sub-class card\nconst subListEl = document.getElementById('sub-list');\nconst subCount = {};\nLEADS.forEach(l => { subCount[l.sub] = (subCount[l.sub]||0) + 1; });\nObject.entries(subCount).sort((a,b)=>priority({sub:a[0]}) - priority({sub:b[0]})).forEach(([sub, cnt]) => {\n  const row = document.createElement('div');\n  row.className = 'comm-row';\n  row.innerHTML = '<span class=\"comm-name\" style=\"color:'+(SUB_COLORS[sub]||'#0d4f4e')+'\">'+sub+'</span><span class=\"comm-count\">'+cnt+' lead'+(cnt===1?'':'s')+'</span>';\n  row.addEventListener('click', () => openDrill(sub, LEADS.filter(l => l.sub === sub)));\n  subListEl.appendChild(row);\n});\n\n// Lead cards (detalhe completo)\nconst container = document.getElementById('leads-container');\nconst sorted = [...LEADS].sort((a,b) => priority(a) - priority(b));\nsorted.forEach(l => {\n  const color = SUB_COLORS[l.sub] || '#0d4f4e';\n  const isSweet = (l.size_tier||'').includes('✓');\n  const sizeTierChip = isSweet\n    ? '<span class=\"chip sweet\">Sweet Spot</span>'\n    : '<span class=\"chip warn\">'+(l.size_tier||'Below ICP')+'</span>';\n  const commsChips = (l.communities||[]).map(c => '<span class=\"chip comm\" data-comm=\"'+c+'\">'+c+'</span>').join(' ');\n\n  const card = document.createElement('div');\n  card.className = 'lead-card';\n  card.style.borderLeftColor = color;\n  card.innerHTML =\n    '<div class=\"lead-top\">' +\n      '<div>' +\n        '<div class=\"lead-name\">'+l.name+'</div>' +\n        '<div class=\"lead-title\">'+l.title+'</div>' +\n        '<div class=\"lead-company\">'+l.company+' · '+(l.location||'')+'</div>' +\n      '</div>' +\n      '<div class=\"chips\">' +\n        '<span class=\"chip sub\" style=\"background:'+color+'\">'+l.sub+' · w'+l.weight+'</span>' +\n        sizeTierChip +\n      '</div>' +\n    '</div>' +\n    '<div class=\"chips\" style=\"margin-bottom:6px\">'+commsChips+'</div>' +\n    '<div class=\"lead-meta\">' +\n      '<div><div class=\"m-l\">Company Size</div><div class=\"m-v\">'+(l.size||'—')+'</div></div>' +\n      '<div><div class=\"m-l\">Annual Revenue</div><div class=\"m-v\">'+(l.revenue||'—')+'</div></div>' +\n      '<div><div class=\"m-l\">HQ</div><div class=\"m-v\">'+(l.hq||'—')+'</div></div>' +\n      '<div><div class=\"m-l\">Segment</div><div class=\"m-v\">'+(l.segment||'—')+'</div></div>' +\n      '<div><div class=\"m-l\">Customer Base</div><div class=\"m-v\">'+(l.customer_count||'—')+'</div></div>' +\n      '<div><div class=\"m-l\">Communities Active</div><div class=\"m-v\">'+(l.communities||[]).length+'</div></div>' +\n    '</div>' +\n    '<div class=\"lead-signal\">' +\n      '<div class=\"sig-l\">Signal / Activity</div>' +\n      (l.activity||'—') +\n    '</div>' +\n    '<div class=\"lead-actions\">' +\n      '<a href=\"'+l.linkedin+'\" target=\"_blank\" rel=\"noopener\">View LinkedIn →</a>' +\n    '</div>';\n  container.appendChild(card);\n});\n\n// Chips de comunidade dentro dos lead cards também abrem drill\ndocument.querySelectorAll('.chip.comm').forEach(chip => {\n  chip.addEventListener('click', (e) => {\n    e.stopPropagation();\n    const c = chip.dataset.comm;\n    openDrill(c + ' community', LEADS.filter(l => (l.communities||[]).includes(c)));\n  });\n});\n<\/script>\n</body>\n</html>", "competitors": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Birdie — Competitor Lookalikes Dashboard</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{background:#f4f8f8;color:#0d4f4e;min-width:320px;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.5}\n.app{display:flex;min-height:100vh}\n\n/* Sidebar desktop */\n.sidebar{width:280px;background:#0d4f4e;color:#fff;padding:24px 0;position:fixed;height:100vh;overflow-y:auto}\n.sidebar .logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}\n.sidebar .logo h1{font-size:24px;font-weight:800;letter-spacing:-.02em}\n.sidebar .logo h1 .b{color:#5ac8b8}\n.sidebar .logo .sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}\n.sidebar .all-btn{margin:0 16px 16px;padding:14px 16px;background:#5ac8b8;color:#0d4f4e;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;transition:background .15s}\n.sidebar .all-btn:hover{background:#7ad5c6}\n.sidebar .all-btn.active{background:#fff;color:#0d4f4e}\n.sidebar .all-btn .badge{background:#0d4f4e;color:#5ac8b8;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:800}\n.sidebar .all-btn.active .badge{background:#0d4f4e;color:#fff}\n\n.sidebar .group{margin-bottom:18px}\n.sidebar .group-title{padding:0 24px 6px;font-size:9px;font-weight:800;color:#5ac8b8;text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px;border-bottom:1px solid rgba(90,200,184,.15);padding-bottom:8px;margin:0 16px 8px;display:flex;align-items:center;gap:6px}\n.sidebar .group-icon{width:14px;height:14px}\n.sidebar .list-item{padding:9px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;transition:background .15s;margin:0 12px;border-radius:6px}\n.sidebar .list-item:hover{background:rgba(255,255,255,.08)}\n.sidebar .list-item.active{background:#5ac8b8;color:#0d4f4e}\n.sidebar .badge{background:rgba(255,255,255,.12);padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700}\n.sidebar .list-item.active .badge{background:#0d4f4e;color:#5ac8b8}\n.sidebar .dot{width:8px;height:8px;border-radius:50%;margin-right:8px;display:inline-block}\n.sidebar .dot.competitor{background:#ff6b6b}\n.sidebar .dot.adjacent{background:#ffb84d}\n.sidebar .dot.greenfield{background:#7dd87d}\n.sidebar .tier-bar{width:4px;height:18px;margin-right:8px;border-radius:2px}\n\n.main{margin-left:280px;padding:32px 40px;flex:1;padding-bottom:460px}\n.page-header{margin-bottom:24px}\n.page-header h2{font-size:22px;font-weight:800;letter-spacing:-.01em}\n.page-header .subtitle{color:#6b8b8a;font-size:12px;margin-top:4px}\n\n.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}\n.kpi{background:#fff;padding:16px 14px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06);cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:3px solid transparent}\n.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(13,79,78,.12)}\n.kpi.kpi-total{border-top-color:#0d4f4e}\n.kpi.kpi-t1{border-top-color:#1b7a78}\n.kpi.kpi-competitor{border-top-color:#ff6b6b}\n.kpi.kpi-adjacent{border-top-color:#ffb84d}\n.kpi.kpi-greenfield{border-top-color:#7dd87d}\n.kpi .l{font-size:10px;color:#6b8b8a;text-transform:uppercase;letter-spacing:.08em;font-weight:700}\n.kpi .v{font-size:28px;font-weight:800;color:#0d4f4e;margin-top:4px;line-height:1}\n.kpi .d{font-size:10px;color:#6b8b8a;margin-top:2px}\n\n/* Charts grid */\n.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}\n.chart-card{background:#fff;padding:18px 20px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06)}\n.chart-card h3{font-size:12px;font-weight:800;color:#0d4f4e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}\n.chart-card h3 .hint{font-size:10px;color:#6b8b8a;text-transform:none;letter-spacing:0;font-weight:500}\n\n/* SVG bar charts */\n.bar-row{display:flex;align-items:center;margin-bottom:10px;cursor:pointer;padding:3px 4px;border-radius:4px;transition:background .15s}\n.bar-row:hover{background:#f4f8f8}\n.bar-label{width:110px;font-size:11px;font-weight:700;color:#0d4f4e;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;padding-right:8px;flex-shrink:0}\n.bar-track{flex:1;background:#eef4f3;height:22px;border-radius:4px;position:relative;overflow:hidden}\n.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-width:28px;transition:width .3s}\n.bar-value{font-size:11px;color:#0d4f4e;font-weight:800;margin-left:8px;min-width:24px;text-align:right;flex-shrink:0}\n\n/* Donut */\n.donut-wrap{display:flex;align-items:center;gap:24px}\n.donut-svg{flex-shrink:0}\n.donut-legend{flex:1;display:flex;flex-direction:column;gap:8px}\n.donut-legend .legend-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border-radius:4px;transition:background .15s}\n.donut-legend .legend-row:hover{background:#f4f8f8}\n.donut-legend .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}\n.donut-legend .legend-label{flex:1;font-size:11px;font-weight:700;color:#0d4f4e}\n.donut-legend .legend-value{font-size:11px;font-weight:800;color:#0d4f4e}\n.donut-legend .legend-pct{font-size:10px;color:#6b8b8a;margin-left:6px}\n\n/* Heatmap */\n.heatmap-wrap{overflow-x:auto}\n.heatmap{border-collapse:collapse;font-size:10px}\n.heatmap th{padding:4px 6px;text-align:center;color:#0d4f4e;font-weight:800;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;background:#f4f8f8;position:sticky;top:0}\n.heatmap th.tool-header{writing-mode:vertical-rl;transform:rotate(180deg);height:80px;vertical-align:bottom;padding:6px 4px}\n.heatmap td{padding:3px 5px;border:1px solid #eef4f3;text-align:center;vertical-align:middle}\n.heatmap td.acct{text-align:left;font-weight:700;font-size:11px;white-space:nowrap;padding:3px 10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}\n.heatmap td.acct:hover{background:#f4f8f8;color:#1b7a78}\n.heatmap .cell-yes{background:#ff6b6b;color:#fff;font-weight:800;font-size:11px}\n.heatmap .cell-no{background:#fafafa;color:#ddd}\n.heatmap tr:hover td.cell-no{background:#f4f8f8}\n\n/* Table */\n.tbl-wrap{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06);overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:12px}\nthead th{background:#f4f8f8;color:#0d4f4e;text-transform:uppercase;letter-spacing:.05em;font-size:10px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid #e5eeed;white-space:nowrap}\ntbody td{padding:10px 12px;border-bottom:1px solid #eef4f3;color:#0d4f4e;vertical-align:top}\ntbody tr:hover{background:#f4f8f8}\ntbody tr{cursor:pointer}\n.tbl-wrap a{color:#1b7a78;text-decoration:none;font-weight:700}\n.tbl-wrap a:hover{text-decoration:underline}\n.chip{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}\n.chip.tier{color:#fff}\n.intent-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}\n.intent-dot.competitor{background:#ff6b6b}\n.intent-dot.adjacent{background:#ffb84d}\n.intent-dot.lookalike{background:#5bc0de}\n.intent-dot.green{background:#7dd87d}\n\n/* Drill */\n.drill{position:fixed;bottom:0;left:280px;right:0;height:0;background:#fff;box-shadow:0 -4px 20px rgba(13,79,78,.12);transition:height .3s;overflow:hidden;z-index:100}\n.drill.open{height:440px}\n.drill-h{padding:14px 24px;background:#0d4f4e;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}\n.drill-h h4{font-weight:800;font-size:14px}\n.drill-h .btns button{background:#1b7a78;color:#fff;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-weight:700;margin-left:8px;font-size:11px;font-family:inherit;text-transform:uppercase;letter-spacing:.05em}\n.drill-h .btns button:hover{background:#5ac8b8;color:#0d4f4e}\n.drill-body{overflow-y:auto;max-height:calc(100% - 50px)}\n.drill-body .tbl-wrap{border-radius:0;box-shadow:none;padding:0}\n\n/* RESPONSIVE */\n@media (max-width:1200px){\n  .main{padding:24px 24px;padding-bottom:460px}\n  .kpis{grid-template-columns:repeat(3,1fr)}\n  .charts-row{grid-template-columns:1fr}\n}\n@media (max-width:900px){\n  .app{flex-direction:column}\n  .sidebar{position:relative;width:100%;height:auto;padding:16px 18px}\n  .sidebar .logo{margin-bottom:12px;padding-bottom:12px}\n  .sidebar .all-btn{margin:0 0 12px;padding:10px 14px;font-size:12px}\n  .sidebar .group{margin-bottom:12px}\n  .sidebar .group-title{padding:0;margin:10px 0 6px;font-size:9px;border:none;display:block}\n  .sidebar .list-item{display:inline-flex;margin:3px 6px 3px 0;padding:5px 10px;font-size:11px;border-radius:6px;background:rgba(255,255,255,.08);white-space:nowrap}\n  .sidebar .list-item .tier-bar{height:10px;width:3px;margin-right:5px}\n  .main{margin-left:0;padding:20px 18px;padding-bottom:20px}\n  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}\n  .page-header h2{font-size:18px}\n  .drill{left:0}\n  .drill.open{height:100vh;top:0;bottom:0}\n  .drill-body{max-height:calc(100vh - 60px)}\n  table{font-size:11px}\n  thead th,tbody td{padding:6px 8px;white-space:nowrap}\n  .donut-wrap{flex-direction:column;align-items:stretch}\n}\n@media (max-width:600px){\n  .main{padding:16px 12px}\n  .kpis{grid-template-columns:1fr 1fr;gap:8px}\n  .kpi{padding:12px 10px}\n  .kpi .v{font-size:22px}\n  .page-header h2{font-size:16px}\n  .chart-card{padding:14px}\n  .bar-label{width:80px;font-size:10px}\n  .heatmap th.tool-header{height:60px;font-size:9px}\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"sidebar\">\n  <div class=\"logo\">\n    <h1><span class=\"b\">b</span>irdie</h1>\n    <div class=\"sub\">Competitor Lookalikes</div>\n  </div>\n\n  <div class=\"all-btn active\" data-filter=\"all\">\n    <span>All Accounts</span>\n    <span class=\"badge\">64</span>\n  </div>\n\n  <div class=\"group\">\n    <div class=\"group-title\">🎯 Priority Tier</div>\n    <div class=\"list-item\" data-filter=\"tier\" data-val=\"Tier 1\">\n      <span><span class=\"tier-bar tyle=\"font-size:12px;color:#1b7a78;margin-top:4px\">'+a.target_titles+'</div></div>' +\n    '<div style=\"margin-top:14px;padding:12px;background:#0d4f4e;border-radius:6px;color:#fff\"><div style=\"font-size:10px;color:#5ac8b8;text-transform:uppercase;font-weight:700\">Recommended Next Step</div><div style=\"font-size:14px;margin-top:4px;font-weight:700\">'+a.next_step+'</div></div>' +\n  '</div>';\n  document.getElementById('drill-title').textContent = a.lookalike + ' — Account Detail';\n  document.getElementById('drill-body').innerHTML = detail;\n  drillData = [a];\n  document.getElementById('drill').classList.add('open');\n}\n\nfunction closeDrill(){document.getElementById('drill').classList.remove('open');}\n\nfunction exportDrill(){\n  if(drillData.length === 0) return;\n  const cols = ['Tier','ICP','Account','Segment','Country','Locality','Size','Employee Count','Annual Revenue',\n                'Source','Customer Original','Site','Intent','Competitors','Adjacent CX',\n                'D1','D1 Label','D2','D2 Label','D3','D3 Label','D4','D4 Label',\n                'Target Sub','Target Titles','Next Step'];\n  const rows = drillData.map(a => [\n    a.tier, a.icp, a.lookalike, a.segmento, a.pais, a.locality, a.size, a.employee_count, a.annual_revenue,\n    a.plataforma_voc, a.customer_original, a.site, intentLabel(a),\n    a.competitors_detected.join('; '), a.adjacent_cx_detected.join('; '),\n    a.d1, a.d1_label, a.d2, a.d2_label, a.d3, a.d3_label, a.d4, a.d4_label,\n    a.target_sub, a.target_titles, a.next_step\n  ]);\n  const csv = [cols, ...rows].map(r => r.map(v => {\n    v = v == null ? '' : String(v);\n    if(v.includes(',') || v.includes('\"') || v.includes('\\n')) return '\"'+v.replace(/\"/g,'\"\"')+'\"';\n    return v;\n  }).join(',')).join('\\n');\n  const blob = new Blob(['\\ufeff'+csv], {type:'text/csv;charset=utf-8'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'birdie_lookalikes_' + Date.now() + '.csv';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\n// Sidebar clicks — TODOS abrem drill + atualizam tabela principal\ndocument.querySelectorAll('.sidebar .list-item, .sidebar .all-btn').forEach(el => {\n  el.addEventListener('click', () => {\n    document.querySelectorAll('.sidebar .list-item, .sidebar .all-btn').forEach(e => e.classList.remove('active'));\n    el.classList.add('active');\n    const filter = el.dataset.filter;\n    const val = el.dataset.val;\n    let title, rows;\n    if(filter === 'all'){\n      title = 'All Accounts'; rows = ACCOUNTS;\n    } else if(filter === 'plat'){\n      title = val + ' (source)'; rows = ACCOUNTS.filter(a => a.plataforma_voc === val);\n    } else if(filter === 'tier'){\n      title = val; rows = ACCOUNTS.filter(a => a.tier === val);\n    } else if(filter === 'intent'){\n      if(val === 'competitor'){title='Active Competitor'; rows=ACCOUNTS.filter(a => a.competitors_detected.length>0);}\n      else if(val === 'adjacent'){title='Adjacent CX'; rows=ACCOUNTS.filter(a => a.adjacent_cx_detected.length>0 && a.competitors_detected.length===0);}\n      else{title='Greenfield'; rows=ACCOUNTS.filter(a => a.competitors_detected.length===0 && a.adjacent_cx_detected.length===0);}\n    }\n    renderMainTable(rows);\n    openDrill(title, rows);\n  });\n});\n\n// === CHART: Tier bar ===\nfunction renderTierChart(){\n  const data = [\n    {label:'Tier 1', count:ACCOUNTS.filter(a=>a.tier==='Tier 1').length, color:'#0d4f4e', key:'tier1'},\n    {label:'Tier 2', count:ACCOUNTS.filter(a=>a.tier==='Tier 2').length, color:'#1b7a78', key:'tier2'},\n    {label:'Tier 3', count:ACCOUNTS.filter(a=>a.tier==='Tier 3').length, color:'#5ac8b8', key:'tier3'},\n    {label:'Out', count:ACCOUNTS.filter(a=>a.tier==='Out').length, color:'#c8d6d6', key:'out'},\n  ];\n  const max = Math.max(...data.map(d=>d.count));\n  const el = document.getElementById('chart-tier');\n  el.innerHTML = data.map(d => {\n    const w = (d.count/max*100).toFixed(1);\n    return '<div class=\"bar-row\" onclick=\"drillByName(\\''+d.key+'\\')\">' +\n      '<div class=\"bar-label\">'+d.label+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:'+d.color+'\">'+d.count+'</div></div>' +\n      '<div class=\"bar-value\">'+Math.round(d.count/ACCOUNTS.length*100)+'%</div>' +\n    '</div>';\n  }).join('');\n}\n\n// === CHART: Source donut ===\nfunction renderSourceDonut(){\n  const data = [\n    {label:'Unwrap.ai', count:ACCOUNTS.filter(a=>a.plataforma_voc==='Unwrap.ai').length, color:SOURCE_COLORS['Unwrap.ai']},\n    {label:'unitQ', count:ACCOUNTS.filter(a=>a.plataforma_voc==='unitQ').length, color:SOURCE_COLORS['unitQ']},\n    {label:'Chattermill', count:ACCOUNTS.filter(a=>a.plataforma_voc==='Chattermill').length, color:SOURCE_COLORS['Chattermill']},\n    {label:'Enterpret', count:ACCOUNTS.filter(a=>a.plataforma_voc==='Enterpret').length, color:SOURCE_COLORS['Enterpret']},\n  ];\n  const total = data.reduce((s,d)=>s+d.count, 0);\n  const svg = document.getElementById('donut-source');\n  const cx = 80, cy = 80, r = 60, ir = 38;\n  let a0 = -Math.PI/2;\n  let paths = '';\n  data.forEach(d => {\n    const a1 = a0 + (d.count/total)*2*Math.PI;\n    const large = (a1-a0) > Math.PI ? 1 : 0;\n    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);\n    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);\n    const xi0 = cx + ir*Math.cos(a0), yi0 = cy + ir*Math.sin(a0);\n    const xi1 = cx + ir*Math.cos(a1), yi1 = cy + ir*Math.sin(a1);\n    paths += '<path d=\"M '+x0+' '+y0+' A '+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' L '+xi1+' '+yi1+' A '+ir+' '+ir+' 0 '+large+' 0 '+xi0+' '+yi0+' Z\" fill=\"'+d.color+'\" style=\"cursor:pointer\" onclick=\"openDrill(\\''+d.label+' (source)\\', ACCOUNTS.filter(a => a.plataforma_voc===\\''+d.label+'\\'))\"><title>'+d.label+': '+d.count+'</title></path>';\n    a0 = a1;\n  });\n  svg.innerHTML = paths + '<text x=\"'+cx+'\" y=\"'+(cy-4)+'\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"#0d4f4e\">'+total+'</text><text x=\"'+cx+'\" y=\"'+(cy+16)+'\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6b8b8a\" letter-spacing=\"1\">TOTAL</text>';\n\n  const legend = document.getElementById('donut-source-legend');\n  legend.innerHTML = data.map(d => {\n    const pct = (d.count/total*100).toFixed(0);\n    return '<div class=\"legend-row\" onclick=\"openDrill(\\''+d.label+' (source)\\', ACCOUNTS.filter(a => a.plataforma_voc===\\''+d.label+'\\'))\">' +\n      '<div class=\"legend-dot\" style=\"background:'+d.color+'\"></div>' +\n      '<div class=\"legend-label\">'+d.label+'</div>' +\n      '<div class=\"legend-value\">'+d.count+'</div><div class=\"legend-pct\">('+pct+'%)</div>' +\n    '</div>';\n  }).join('');\n}\n\n// === CHART: Segment bar ===\nfunction renderSegmentChart(){\n  const counts = {};\n  ACCOUNTS.forEach(a => { if(a.segmento){ counts[a.segmento] = (counts[a.segmento]||0)+1; }});\n  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 10);\n  const max = sorted[0][1];\n  const el = document.getElementById('chart-segment');\n  el.innerHTML = sorted.map(([seg, cnt]) => {\n    const w = (cnt/max*100).toFixed(1);\n    return '<div class=\"bar-row\" onclick=\"openDrill(\\''+seg.replace(/\"/g,'\\\\\\\\\"').replace(/'/g,\"\\\\\\\\'\")+' segment\\', ACCOUNTS.filter(a => a.segmento===\\''+seg.replace(/'/g,\"\\\\\\\\'\")+'\\'))\">' +\n      '<div class=\"bar-label\" title=\"'+seg+'\">'+seg+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:#1b7a78\">'+cnt+'</div></div>' +\n      '<div class=\"bar-value\">'+cnt+'</div>' +\n    '</div>';\n  }).join('');\n}\n\n// === CHART: Geography bar ===\nfunction renderGeoChart(){\n  const counts = {};\n  ACCOUNTS.forEach(a => { counts[a.pais] = (counts[a.pais]||0)+1; });\n  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 10);\n  const max = sorted[0][1];\n  const el = document.getElementById('chart-geo');\n  el.innerHTML = sorted.map(([geo, cnt]) => {\n    const w = (cnt/max*100).toFixed(1);\n    const isPrimary = (geo === 'EUA' || geo === 'Canadá');\n    const color = isPrimary ? '#0d4f4e' : '#5ac8b8';\n    return '<div class=\"bar-row\" onclick=\"openDrill(\\''+geo+' accounts\\', ACCOUNTS.filter(a => a.pais===\\''+geo+'\\'))\">' +\n      '<div class=\"bar-label\">'+geo+'</div>' +\n      '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:'+w+'%;background:'+color+'\">'+cnt+'</div></div>' +\n      '<div class=\"bar-value\">'+cnt+'</div>' +\n    '</div>';\n  }).join('');\n}\n\n// === HEATMAP: Tech Stack ===\nfunction renderHeatmap(){\n  const tools = ['Qualtrics','Medallia','Sprinklr','Alida','Inmoment','Verint','Clarabridge','Thematic'];\n  const t1 = ACCOUNTS.filter(a => a.tier==='Tier 1').sort((a,b)=>b.icp-a.icp);\n  let html = '<table class=\"heatmap\"><thead><tr><th style=\"text-align:left\">Tier 1 Account ('+t1.length+')</th>';\n  tools.forEach(t => { html += '<th class=\"tool-header\">'+t+'</th>'; });\n  html += '<th>Total</th></tr></thead><tbody>';\n  t1.forEach(a => {\n    html += '<tr><td class=\"acct\" onclick=\"openAccountDetail('+JSON.stringify(a.lookalike).replace(/\"/g,'&quot;')+')\">'+a.lookalike+'</td>';\n    let tot = 0;\n    tools.forEach(t => {\n      const uses = a._raw && a._raw[t] === 'Yes';\n      if(uses) tot++;\n      html += '<td class=\"'+(uses?'cell-yes':'cell-no')+'\">'+(uses?'●':'')+'</td>';\n    });\n    html += '<td style=\"font-weight:800;color:'+(tot>0?'#ff6b6b':'#c8d6d6')+'\">'+tot+'</td></tr>';\n  });\n  html += '</tbody></table>';\n  document.getElementById('heatmap').innerHTML = html;\n}\n\n// === INIT ===\nrenderTierChart();\nrenderSourceDonut();\nrenderSegmentChart();\nrenderGeoChart();\nrenderHeatmap();\nrenderMainTable(ACCOUNTS);\n<\/script>\n</body>\n</html>", "abm": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Birdie — ABM Lookalikes Dashboard</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{background:#f4f8f8;color:#0d4f4e;min-width:320px;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.5}\n.app{display:flex;min-height:100vh}\n\n.sidebar{width:280px;background:#0d4f4e;color:#fff;padding:24px 0;position:fixed;height:100vh;overflow-y:auto}\n.sidebar .logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}\n.sidebar .logo h1{font-size:24px;font-weight:800;letter-spacing:-.02em}\n.sidebar .logo h1 .b{color:#5ac8b8}\n.sidebar .logo .sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}\n.sidebar .all-btn{margin:0 16px 16px;padding:14px 16px;background:#5ac8b8;color:#0d4f4e;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;transition:background .15s}\n.sidebar .all-btn:hover{background:#7ad5c6}\n.sidebar .all-btn.active{background:#fff;color:#0d4f4e}\n.sidebar .all-btn .badge{background:#0d4f4e;color:#5ac8b8;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:800}\n.sidebar .all-btn.active .badge{background:#0d4f4e;color:#fff}\n\n.sidebar .group{margin-bottom:18px}\n.sidebar .group-title{font-size:9px;font-weight:800;color:#5ac8b8;text-transform:uppercase;letter-spacing:.15em;border-bottom:1px solid rgba(90,200,184,.15);padding-bottom:8px;margin:0 16px 8px;display:block}\n.sidebar .list-item{padding:9px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;transition:background .15s;margin:0 12px;border-radius:6px}\n.sidebar .list-item:hover{background:rgba(255,255,255,.08)}\n.sidebar .list-item.active{background:#5ac8b8;color:#0d4f4e}\n.sidebar .badge{background:rgba(255,255,255,.12);padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700}\n.sidebar .list-item.active .badge{background:#0d4f4e;color:#5ac8b8}\n.sidebar .tier-bar{width:4px;height:18px;margin-right:8px;border-radius:2px;display:inline-block}\n.sidebar .flag{display:inline-block;margin-right:8px}\n\n.main{margin-left:280px;padding:32px 40px;flex:1;padding-bottom:460px}\n.page-header{margin-bottom:24px}\n.page-header h2{font-size:22px;font-weight:800;letter-spacing:-.01em}\n.page-header .subtitle{color:#6b8b8a;font-size:12px;margin-top:4px}\n\n.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}\n.kpi{background:#fff;padding:16px 14px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06);cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:3px solid transparent}\n.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(13,79,78,.12)}\n.kpi.kpi-total{border-top-color:#0d4f4e}\n.kpi.kpi-t1{border-top-color:#1b7a78}\n.kpi.kpi-volume{border-top-color:#ff6b6b}\n.kpi.kpi-b2c{border-top-color:#ffb84d}\n.kpi.kpi-usa{border-top-color:#7dd87d}\n.kpi .l{font-size:10px;color:#6b8b8a;text-transform:uppercase;letter-spacing:.08em;font-weight:700}\n.kpi .v{font-size:28px;font-weight:800;color:#0d4f4e;margin-top:4px;line-height:1}\n.kpi .d{font-size:10px;color:#6b8b8a;margin-top:2px}\n\n.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}\n.chart-card{background:#fff;padding:18px 20px;border-radius:10px;box-shadow:0 1px 3px rgba(13,79,78,.06)}\n.chart-card h3{font-size:12px;font-weight:800;color:#0d4f4e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}\n.chart-card h3 .hint{font-size:10px;color:#6b8b8a;text-transform:none;letter-spacing:0;font-weight:500}\n\n.bar-row{display:flex;align-items:center;margin-bottom:1
